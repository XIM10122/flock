<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171213">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flock">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Flock — Charleston plate readers</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  /* Greyscale first, then one warm accent (design-taste §11a). Amber is the emblem's bolt and
     it is the only colour on the chrome. Red stays for the readers themselves on the map, so the
     two never compete: amber = you and your controls, red = them. Depth is value, then two
     cheap shadows on anything raised — a contact shadow and a soft lift, same light for all. */
  :root{
    --wall:#171213; --card:#242323; --key:#302D2C; --chosen:#3D3837; --sink:#191616;
    --line:rgba(210,206,199,.10); --line2:rgba(210,206,199,.16);
    --ink:#D2CEC7; --ink2:#A29E98; --ink3:#6F6B66;
    --red:#A11A17; --red-tx:#E2635C;
    --amber:#D68A3E; --amber-tx:#E9A75B; --amber-dim:rgba(214,138,62,.14);
    --lift:0 1px 0 rgba(255,255,255,.04) inset, 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.6);
    --r:10px; --r-s:8px; --r-pill:999px;
    --font:ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
    --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  /* dvh, where it exists, so the phone's shrinking address bar doesn't crop the list */
  @supports (height:100dvh){html,body{height:100dvh}}
  body{background:var(--wall);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;
       display:grid;grid-template-rows:auto 1fr;overflow:hidden;padding-top:var(--sat)}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--card)}
  header .mark{width:30px;height:30px;flex:none;color:var(--ink);border-radius:50%;box-shadow:0 0 0 1px var(--line2),0 0 18px -4px var(--amber-dim)}
  header b{font-size:16px;letter-spacing:-.01em}
  header small{color:var(--ink3);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  header .n{margin-left:auto;font:12px var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}

  .app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;min-height:0}
  aside{display:grid;grid-template-rows:auto auto 1fr;min-height:0;border-right:1px solid var(--line);background:var(--card)}

  .find{display:grid;grid-template-columns:1fr auto;gap:6px;padding:10px 12px 6px}
  .find input{width:100%;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--sink);color:var(--ink);font:inherit;min-width:0;box-shadow:inset 0 1px 2px rgba(0,0,0,.35);transition:border-color .15s,box-shadow .15s}
  .find input::placeholder{color:var(--ink3)}
  .find input:focus{outline:none;border-color:var(--amber);box-shadow:inset 0 1px 2px rgba(0,0,0,.35),0 0 0 3px var(--amber-dim)}
  /* one line under the box for lookup progress and failures, in place of alert() */
  .status{grid-column:1/-1;font-size:12px;color:var(--ink2);min-height:0;padding:2px 2px 0}
  .status:empty{display:none}
  .status.bad{color:var(--red-tx)}
  .status:not(.bad){color:var(--amber-tx)}
  button{font:inherit;color:var(--ink);background:var(--key);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;cursor:pointer;white-space:nowrap;box-shadow:var(--lift);transition:background .15s,border-color .15s,color .15s}
  button:hover{background:var(--chosen)}
  button.on{background:var(--chosen);font-weight:600;border-color:var(--amber);color:var(--amber-tx)}
  button[disabled]{opacity:.5;cursor:default}
  button.busy{color:transparent;position:relative}
  button.busy::after{content:"";position:absolute;inset:0;margin:auto;width:12px;height:12px;border:2px solid var(--ink3);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .chips{display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .chips button{padding:5px 10px;font-size:12px;border-radius:var(--r-pill);box-shadow:none}
  .chips button small{color:var(--ink3);font-weight:400;margin-left:2px}
  .chips button.on small{color:var(--amber-tx);opacity:.8}
  .chips button.on{color:var(--amber-tx);background:var(--amber-dim)}
  .chips .sp{flex:1}
  .chips .near{font-size:12px;color:var(--ink2);align-self:center;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .chips .near b{color:var(--ink);font-weight:600}
  .chips .near a{color:var(--ink3);text-decoration:none;margin-left:6px;cursor:pointer}
  .chips .near a:hover{color:var(--ink)}

  .list{overflow:auto;padding:6px 0;scrollbar-width:thin;scrollbar-color:var(--key) transparent;-webkit-overflow-scrolling:touch}
  .town{position:sticky;top:0;z-index:1;padding:8px 14px 4px;font:600 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);background:var(--card)}
  .li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 14px;cursor:pointer;border-left:2px solid transparent;transition:background .12s}
  .li:hover{background:var(--key)}
  .li.on{background:var(--chosen);border-left-color:var(--amber)}
  .li .a{font-weight:500}
  .li.on .a{font-weight:600}
  .li .s{grid-column:1/-1;font-size:12px;color:var(--ink2)}
  .li .d{font:11px var(--mono);color:var(--ink3);align-self:start;padding-top:2px;font-variant-numeric:tabular-nums;text-align:right}
  .li .d b{display:block;color:var(--ink2);font-weight:600}
  .li.on .d,.li.on .s{color:var(--ink)}
  .li.on .d b{color:var(--amber-tx)}
  .li.kb{background:var(--key)}
  .empty{padding:24px 14px;color:var(--ink3);text-align:center}
  .empty code{color:var(--ink2)}
  .empty button{margin-top:12px;font-size:12px;padding:7px 12px}
  .skel{height:38px;margin:6px 14px;border-radius:6px;background:linear-gradient(90deg,var(--key),var(--chosen),var(--key));background-size:200% 100%;animation:sk 1.2s linear infinite}
  @keyframes sk{to{background-position:-200% 0}}

  .mapwrap{position:relative;min-height:0;display:grid}
  #map{min-height:0;background:var(--sink)}
  .leaflet-container{font:inherit;background:var(--sink)}
  .pin{width:16px;height:16px;position:relative}
  .pin i{position:absolute;inset:3px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--wall)}
  .pin.on i{background:var(--red-tx);box-shadow:0 0 0 2px var(--wall),0 0 0 6px rgba(226,99,92,.25)}
  .pin s{position:absolute;left:7px;top:-7px;width:2px;height:10px;background:var(--red-tx);transform-origin:1px 15px;border-radius:1px}
  .pin.on s{background:#fff}
  .me{width:22px;height:22px;position:relative}
  .me::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px var(--wall),0 0 0 6px var(--amber-dim)}
  .me .hd{position:absolute;left:8px;top:-8px;width:6px;height:14px;transform-origin:3px 19px;display:none}
  .me .hd::before{content:"";position:absolute;left:0;top:0;border:3px solid transparent;border-bottom:9px solid var(--amber-tx);border-top:0}
  .leaflet-popup-content-wrapper{border-radius:var(--r);border:1px solid var(--line2)}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--ink);box-shadow:var(--lift)}
  .leaflet-popup-content{margin:10px 12px;font-size:13px;line-height:1.4}
  .leaflet-popup-content b{display:block;font-size:14px}
  .leaflet-popup-content small{color:var(--ink2);display:block}
  .leaflet-popup-content .acts{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px}
  .leaflet-popup-content a{color:var(--amber-tx);text-decoration:none;font-size:12px}
  .leaflet-popup-content a:hover{text-decoration:underline}
  .leaflet-popup-content a.fix{color:var(--ink3)}
  .leaflet-popup-content a.fix:hover{color:var(--ink2)}
  .addpop .leaflet-popup-content-wrapper{border-color:var(--amber)}
  .leaflet-control-zoom{border:0!important;box-shadow:var(--lift)!important;border-radius:var(--r-s)!important;overflow:hidden}
  .leaflet-control-zoom a{background:var(--card)!important;color:var(--ink)!important;border-color:var(--line)!important;width:32px!important;height:32px!important;line-height:30px!important}
  .leaflet-control-attribution{background:rgba(23,18,19,.75)!important;color:var(--ink3)!important;font-size:10px}
  .leaflet-control-attribution a{color:var(--ink2)!important}
  .leaflet-tile-pane{filter:brightness(.72) contrast(1.05) saturate(.7)}
  .leaflet-container.sat .leaflet-tile-pane{filter:none}

  /* "Save to phone": what to tap, drawn rather than described, because the wording of
     these menu items differs between phones but the icons do not. */
  .built{color:var(--ink3);font-size:11px;white-space:nowrap}
  button.ghost{background:transparent;border-color:var(--line);color:var(--ink2);font-size:12px;padding:5px 10px;box-shadow:none}
  button.ghost:hover{background:var(--key);color:var(--ink)}
  dialog#sheet{border:1px solid var(--line2);border-radius:16px;background:var(--card);color:var(--ink);
               padding:0;width:min(420px,calc(100vw - 28px));max-height:86vh;overflow:auto;box-shadow:var(--lift),0 24px 64px -24px rgba(0,0,0,.8)}
  dialog#sheet::backdrop{background:rgba(0,0,0,.55)}
  .sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
  .sheet-h b{font-size:15px}
  .sheet-h button{margin-left:auto;padding:4px 9px;font-size:12px}
  .sheet-t{display:flex;gap:6px;padding:0 16px 12px}
  .sheet-t button{flex:1;font-size:12px;padding:6px 8px}
  .steps{display:grid;gap:2px;padding:0 16px 16px}
  .step{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
  .step .art{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;background:var(--sink);border:1px solid var(--line);color:var(--ink)}
  .step .art svg{width:24px;height:24px}
  .step .n{font:600 10.5px/1 var(--mono);letter-spacing:.14em;color:var(--ink3);text-transform:uppercase}
  .step p{margin:3px 0 0;font-size:13px;color:var(--ink)}
  .step p em{font-style:normal;color:var(--amber-tx)}
  .sheet-f{padding:0 16px 16px;font-size:12px;color:var(--ink3)}
  .sheet-f button{width:100%;margin-bottom:10px;font-size:13px;padding:10px}

  .layers{position:absolute;right:10px;top:10px;z-index:500;display:flex;gap:1px;background:var(--line2);border-radius:var(--r-s);overflow:hidden;box-shadow:var(--lift)}
  .layers button{border:0;border-radius:0;padding:7px 11px;background:var(--card);color:var(--ink2);font-size:12px;box-shadow:none}
  .layers button.on{background:var(--chosen);color:var(--amber-tx)}

  /* phone: list under a shorter map, both scrollable, nothing under the home bar */
  @media (max-width:760px){
    .app{grid-template-columns:1fr;grid-template-rows:minmax(180px,1fr) auto}
    aside{border-right:0;border-top:1px solid var(--line);grid-row:2;max-height:55vh;padding-bottom:var(--sab)}
    @supports (height:100dvh){aside{max-height:55dvh}}
    .mapwrap{grid-row:1}
    header small:not(.built){display:none}   /* the strapline goes; how old the data is stays */
    header{gap:8px;padding:10px 12px}
    .li{padding:11px 14px}
    .chips{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chips .sp{display:none}
    .layers{top:8px;right:8px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
  }
</style>
</head>

on":-80.1578533,"label":"Rowe Lane, Summerville","address":{"road":"Rowe Lane","retail":"North Main Market","hamlet":"South Pointe","city":"Summerville","county":"Berkeley County","state":"South Carolina","ISO3166-2-lvl4":"US-SC","postcode":"28493","country":"United States","country_code":"us"},"road":"Rowe Lane","city":"Summerville","postcode":"28493","operator":"Lowe's","maker":"Flock Safety","direction":"214","mount":"pole","zone":"traffic"},{"id":"14097440002","lat":33.0425032,"lon":-80.1197472,"label":"2080 Royle Road, Summerville","address":{"house_number":"2080","road":"Royle Road","hamlet":"Highland Village","city":"Summerville","county":"Berkeley County","state":"South Carolina","ISO3166-2-lvl4":"US-SC","postcode":"29486","country":"United States","country_code":"us"},"road":"Royle Road","city":"Summerville","postcode":"29486","operator":"","maker":"Flock Safety","direction":"112","mount":"","zone":"traffic"},{"id":"14097550401","lat":33.0426924,"lon":-80.1196425,"label":"2080 Royle Road, Summerville","address":{"house_number":"2080","road":"Royle Road","hamlet":"Highland Village","city":"Summerville","county":"Berkeley County","state":"South Carolina","ISO3166-2-lvl4":"US-SC","postcode":"29486","country":"United States","country_code":"us"},"road":"Royle Road","city":"Summerville","postcode":"29486","operator":"","maker":"Flock Safety","direction":"299","mount":"","zone":"traffic"},{"id":"14056329201","lat":33.0022154,"lon":-80.1848608,"label":"Sawmill Branch Trail, Summerville","address":{"road":"Sawmill Branch Trail","hamlet":"Rosehill","city":"Summerville","county":"Dorchester County","state":"South Carolina","ISO3166-2-lvl4":"US-SC","postcode":"39485","country":"United States","country_code":"us"},"road":"Sawmill Branch Trail","city":"Summerville","postcode":"39485","operator":"","maker":"Flock Safety","direction":"137","mount":"","zone":"traffic"},{"id":"13093117740","lat":33.0564235,"lon":-80.1578577,"label":"Nexton Parkway, Weatherstone","address":{"road":"Nexton Parkway","suburb":"Weatherstone","county":"Berkeley County","state":"South Carolina","ISO3166-2-lvl4":"US-SC","postcode":"29486","country":"United States","country_code":"us"},"road":"Nexton Parkway","city":"Weatherstone","postcode":"29486","operator":"","maker":"Flock Safety","direction":"225","mount":"","zone":""},{"id":"14059881501","lat":33.0462059,"lon":-80.1835879,"label":"Old Dairy Road, Weatherstone","address":{"road":"Old Dairy Road","suburb":"Weatherstone","county":"Berkeley County","state":"South Carolina","ISO3166-2-lvl4":"US-SC","postcode":"29483","country":"United States","country_code":"us"},"road":"Old Dairy Road","city":"Weatherstone","postcode":"29483","operator":"","maker":"Flock Safety","direction":"224","mount":"","zone":"traffic"}]}</script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Honour the OS setting for map flights too, not just CSS animation. A hidden tab gets
// no animation frames, so a link opened in the background would otherwise never arrive:
// jump there instead, and it is already in place when the tab is looked at.
const CALM = matchMedia('(prefers-reduced-motion: reduce)');
const fly = (latlng, zoom, secs) => {
  const z = zoom == null ? map.getZoom() : zoom;
  return (CALM.matches || document.hidden)
    ? map.setView(latlng, z, { animate: false })
    : map.flyTo(latlng, z, { duration: secs });
};

// One line under the search box. Beats alert(), which a standalone PWA renders badly.
let statusTimer = null;
function say(msg, bad) {
  const el = $('#status');
  el.textContent = msg || '';
  el.classList.toggle('bad', !!bad);
  clearTimeout(statusTimer);
  if (msg) statusTimer = setTimeout(() => { el.textContent = ''; el.classList.remove('bad'); }, 6000);
}

const map = L.map('map', { zoomControl: true }).setView([32.82, -79.95], 11);
const street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imagery &copy; Esri' });
document.querySelectorAll('.layers button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.layers button').forEach(x => x.classList.toggle('on', x === b));
  const isSat = b.dataset.l === 'sat';
  map.removeLayer(isSat ? street : sat); map.addLayer(isSat ? sat : street);
  map.getContainer().classList.toggle('sat', isSat);
});

let CAMS = [], MARK = {}, CONE = {}, CUR = null;
let BYID = new Map();                             // id -> camera, so lookups aren't a scan
let ROWS = [];                                    // what the list is showing, in order
let KB = -1;                                      // arrow-key position within ROWS
let ARROWED = false;                              // true only while arrow keys are steering
let HOME = null, HOMEMARK = null, RING = null;   // where distances are measured from
let OP = 'all';                                   // operator chip
let SHOWN = null;                                 // the operator the map layers currently reflect

// Wedges are smaller than a pixel when the whole county is on screen. Draw them
// only once the map is close enough for them to mean something.
const CONE_ZOOM = 14;
let conesOn = false;

// "0;182" is two readers on one pole facing both ways: one tick per direction
const dirs = d => String(d ?? '').split(';').map(s => s.trim()).filter(s => s !== '' && !isNaN(+s)).map(Number);
const dirText = d => { const a = dirs(d); return a.length ? a.map(x => x + '°').join(' and ') : ''; };

function pinIcon(dir, on) {
  const rot = dirs(dir).map(x => `<s style="transform:rotate(${x}deg)"></s>`).join('');
  return L.divIcon({ className: '', iconSize: [16, 16], iconAnchor: [8, 8], popupAnchor: [0, -8], html: `<div class="pin${on ? ' on' : ''}">${rot}<i></i></div>` });
}

// A reader sees roughly 30° either side of where it points, out to about 75 m of road.
// The wedge is that: one repeated mark, one varying parameter (design-taste §11c).
function coneFor(c) {
  const g = L.layerGroup();
  const R = 0.00068, HALF = 30;    // ~75 m in degrees of latitude; half-angle
  for (const d of dirs(c.direction)) {
    const pts = [[c.lat, c.lon]];
    for (let a = d - HALF; a <= d + HALF; a += 6) {
      const r = a * Math.PI / 180;
      pts.push([c.lat + R * Math.cos(r), c.lon + R * Math.sin(r) / Math.cos(c.lat * Math.PI / 180)]);
    }
    g.addLayer(L.polygon(pts, { color: '#E2635C', weight: 1, opacity: .55, fillColor: '#A11A17', fillOpacity: .18, interactive: false }));
  }
  return g;
}

const gmaps = c => `https://www.google.com/maps?q=${c.lat},${c.lon}`;
// The data is OpenStreetMap's. "Wrong / gone / missing" goes back to the source, at this
// exact node, in OSM's own editor — the person standing under the pole is the one who knows.
const osmEdit = c => /^\d+$/.test(c.id)
  ? `https://www.openstreetmap.org/edit?node=${c.id}#map=19/${c.lat}/${c.lon}`
  : `https://www.openstreetmap.org/edit#map=19/${c.lat}/${c.lon}`;
const osmAdd = (lat, lon) => `https://www.openstreetmap.org/edit#map=19/${lat}/${lon}`;
function popupHtml(c) {
  const bits = [];
  if (c.operator) bits.push(esc(c.operator));
  if (c.maker) bits.push(esc(c.maker));
  if (dirText(c.direction)) bits.push('faces ' + dirText(c.direction));
  const dist = HOME ? `<small>${fmtMi(milesTo(c))} from ${esc(HOME.name)}</small>` : '';
  return `<b>${esc(c.label)}</b><small>${bits.join(' · ') || 'no details recorded'}</small>${dist}
    <div class="acts"><a href="${gmaps(c)}" target="_blank" rel="noopener">Google Maps ↗</a><a href="#" data-copy="${esc(c.label)}">Copy address</a><a href="#" data-share="${esc(c.id)}">Copy link</a><a href="${osmEdit(c)}" target="_blank" rel="noopener" title="Wrong, moved, or gone? Fix it at the source" class="fix">Fix on OSM ↗</a></div>`;
}
map.on('popupopen', e => {
  const el = e.popup.getElement();
  const copy = (a, text) => {
    a.onclick = async ev => {
      ev.preventDefault();
      try { await navigator.clipboard.writeText(text); a.textContent = 'Copied'; }
      catch (err) { say('The browser blocked the clipboard. Here it is: ' + text); }
    };
  };
  const a = el.querySelector('[data-copy]'); if (a) copy(a, a.dataset.copy);
  const s = el.querySelector('[data-share]'); if (s) copy(s, linkTo(s.dataset.share));
});

// A reader that isn't on the map: press and hold where it is (right-click on a desk),
// and OSM's editor opens there. Leaflet fires contextmenu for both.
map.on('contextmenu', e => {
  const { lat, lng } = e.latlng;
  L.popup({ closeButton: false, className: 'addpop' })
    .setLatLng(e.latlng)
    .setContent(`<b>Reader here that isn't on the map?</b><small>${lat.toFixed(5)}, ${lng.toFixed(5)}</small>
      <div class="acts"><a href="${osmAdd(lat, lng)}" target="_blank" rel="noopener" class="fix">Add it on OSM ↗</a></div>`)
    .openOn(map);
});

// ---- distance
const milesTo = c => HOME ? haversine(HOME.lat, HOME.lon, c.lat, c.lon) : null;
function haversine(a, b, c, d) {
  const R = 3958.8, r = x => x * Math.PI / 180, dl = r(c - a), dg = r(d - b);
  const h = Math.sin(dl / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dg / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtMi = m => m < .1 ? Math.round(m * 5280) + ' ft' : m.toFixed(m < 10 ? 1 : 0) + ' mi';

// The "me" mark carries a heading arrow. Leaflet can't rotate the whole map, and rotating
// a map in a moving car is worse than a fixed north-up with an arrow anyway.
const meIcon = () => L.divIcon({ className: '', iconSize: [22, 22], iconAnchor: [11, 11], html: '<div class="me"><i class="hd"></i></div>' });
let HEADING = null;
function setHeading(deg) {
  HEADING = (deg == null || isNaN(deg)) ? null : deg;
  const el = HOMEMARK?.getElement()?.querySelector('.hd');
  if (!el) return;
  el.style.display = HEADING == null ? 'none' : '';
  if (HEADING != null) el.style.transform = `rotate(${HEADING}deg)`;
}

function setHome(lat, lon, name, { quiet } = {}) {
  const moved = !HOME || HOME.name !== name;
  HOME = { lat, lon, name };
  if (!HOMEMARK) {
    HOMEMARK = L.marker([lat, lon], { icon: meIcon(), title: name, zIndexOffset: 1000 }).addTo(map);
    RING = L.circle([lat, lon], { radius: 1609.34, color: '#D68A3E', weight: 1, opacity: .45, fillOpacity: .03, interactive: false }).addTo(map);
  } else {
    HOMEMARK.setLatLng([lat, lon]); RING.setLatLng([lat, lon]);
  }
  setHeading(HEADING);
  for (const c of CAMS) MARK[c.id].setPopupContent(popupHtml(c));
  // First fix flies in. Later fixes from the watch just nudge — no yanking the map
  // out from under a finger that is dragging it.
  if (moved && !quiet) fly([lat, lon], 13, .7);
  else if (FOLLOW && !DRAGGING) map.panTo([lat, lon], { animate: !CALM.matches, duration: .4 });
  render($('#q').value);
}
function clearHome() {
  stopWatch();
  HOME = null;
  if (HOMEMARK) map.removeLayer(HOMEMARK); if (RING) map.removeLayer(RING);
  HOMEMARK = RING = null; HEADING = null;
  for (const c of CAMS) MARK[c.id].setPopupContent(popupHtml(c));
  render($('#q').value);
}

// "Near me" is a live watch, not a one-shot: the list re-sorts and the arrow turns as
// you move. Tapping it again stops. Dragging the map pauses following until re-tapped.
let WATCH = null, FOLLOW = false, DRAGGING = false;
map.on('dragstart', () => { DRAGGING = true; if (FOLLOW) { FOLLOW = false; $('#near').classList.remove('on'); $('#near').textContent = 'Near me'; } });
map.on('dragend', () => { DRAGGING = false; });
function stopWatch() {
  if (WATCH != null) navigator.geolocation.clearWatch(WATCH);
  WATCH = null; FOLLOW = false;
  const b = $('#near'); b.classList.remove('on', 'busy'); b.disabled = false; b.textContent = 'Near me';
}
$('#near').onclick = () => {
  const b = $('#near');
  if (WATCH != null) { stopWatch(); return; }
  if (!navigator.geolocation) return say('This browser cannot share a location. Type an address instead.', true);
  b.classList.add('busy'); b.disabled = true; say('Finding you…');
  let first = true;
  WATCH = navigator.geolocation.watchPosition(p => {
    if (first) { b.classList.remove('busy'); b.disabled = false; b.classList.add('on'); b.textContent = 'Following'; say(''); FOLLOW = true; }
    setHeading(p.coords.heading);   // null when standing still; the arrow hides itself
    setHome(p.coords.latitude, p.coords.longitude, 'you', { quiet: !first });
    first = false;
  }, err => {
    stopWatch();
    say(err.code === 1 ? 'Location was refused. Allow it in the browser, or type an address instead.'
                       : 'Could not get a location. Type an address instead.', true);
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 });
};

// An address in the box: Enter looks it up (Nominatim, no key) and measures from there.
// Plain typing still filters the list live.
async function geocode(q) {
  const u = 'https://nominatim.openstreetmap.org/search?' + new URLSearchParams({ q: q + ', South Carolina', format: 'jsonv2', limit: 1, countrycodes: 'us' });
  const r = await fetch(u, { headers: { 'Accept-Language': 'en' } });
  const j = await r.json();
  return j[0] ? { lat: +j[0].lat, lon: +j[0].lon, name: (j[0].display_name || q).split(',').slice(0, 2).join(',') } : null;
}
// Typing filters live, but one frame behind the keystroke so a fast typist isn't
// waiting on 200 rows being laid out between letters.
let typeTimer = null;
$('#q').addEventListener('input', e => {
  const v = e.target.value;
  clearTimeout(typeTimer);
  typeTimer = setTimeout(() => render(v), 90);
});
$('#q').addEventListener('keydown', async e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); return step(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); return step(-1); }
  if (e.key === 'Escape') {
    e.preventDefault();
    if (e.target.value) { e.target.value = ''; render(''); }
    else if (HOME) clearHome();
    else if (OP !== 'all') resetFilters();
    return;
  }
  if (e.key !== 'Enter') return;
  // Arrowing to a row makes Enter mean "this one", not "look this address up".
  if (ARROWED && KB >= 0 && ROWS[KB]) { e.preventDefault(); return select(ROWS[KB].id, true); }
  const q = e.target.value.trim(); if (!q) return;
  e.target.disabled = true; say('Looking up “' + q + '”…');
  try {
    const hit = await geocode(q);
    if (hit) { e.target.value = ''; say(''); setHome(hit.lat, hit.lon, hit.name); }
    else say('Could not find “' + q + '”. Try a street and a town.', true);
  } catch (err) { say('Address lookup failed — no internet, or the lookup service is busy.', true); }
  e.target.disabled = false; e.target.focus();
});

// ---- operator chips: what the data actually contains, not a fixed list
function buildChips() {
  const ops = {};
  for (const c of CAMS) { const k = opKey(c); ops[k] = (ops[k] || 0) + 1; }
  const order = Object.keys(ops).sort((a, b) => ops[b] - ops[a]);
  $('#chips').innerHTML = `<button data-op="all" class="on">All <small>${CAMS.length}</small></button>` +
    order.map(k => `<button data-op="${esc(k)}">${esc(k)} <small>${ops[k]}</small></button>`).join('') +
    `<span class="sp"></span><span class="near" id="nearlab"></span>`;
  $('#chips').querySelectorAll('button').forEach(b => b.onclick = () => {
    OP = b.dataset.op;
    $('#chips').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    render($('#q').value);
  });
}
function opKey(c) {
  const o = (c.operator || '').trim();
  if (!o) return 'Unknown';
  if (/police|sheriff|county|city of|town of|department/i.test(o)) return 'Police';
  return o.length > 18 ? o.slice(0, 17) + '…' : o;
}
const opMatch = c => OP === 'all' || opKey(c) === OP;

// Markers follow the chips so the filter means something on the map too; wedges
// additionally wait for zoom. Both only touch the map when something actually changed.
function syncLayers() {
  const z = map.getZoom();
  const wantCones = z >= CONE_ZOOM;
  const wantPins = z >= PIN_ZOOM;
  const opChanged = SHOWN !== OP;
  if (!opChanged && wantCones === conesOn && wantPins === pinsOn) return;
  for (const c of CAMS) {
    const on = opMatch(c);
    const wantPin = on && wantPins;
    if (wantPin && !map.hasLayer(MARK[c.id])) MARK[c.id].addTo(map);
    else if (!wantPin && map.hasLayer(MARK[c.id])) map.removeLayer(MARK[c.id]);
    const wantCone = on && wantCones;
    if (wantCone && !map.hasLayer(CONE[c.id])) CONE[c.id].addTo(map);
    else if (!wantCone && map.hasLayer(CONE[c.id])) map.removeLayer(CONE[c.id]);
  }
  if (opChanged) densBuilt = false;   // the crowding counts depend on which readers are in
  SHOWN = OP; conesOn = wantCones; pinsOn = wantPins;
  syncDensity(!wantPins);
}
map.on('zoomend', syncLayers);

// ---- density, below PIN_ZOOM
// Two hundred identical pins on a county hide the only interesting fact at that scale:
// where they cluster. So under PIN_ZOOM the pins go and each reader becomes one soft
// disc whose size is how many others sit within ~800 m of it. One mark, one parameter.
const PIN_ZOOM = 13;
let pinsOn = true;
const DENS = L.layerGroup();
let densBuilt = false;
function buildDensity() {
  DENS.clearLayers();
  const R = 0.5;   // miles; the crowding radius
  const rows = CAMS.filter(opMatch);
  for (const c of rows) {
    let n = 0;
    for (const o of rows) if (o !== c && haversine(c.lat, c.lon, o.lat, o.lon) < R) n++;
    // 1 neighbour -> small, 12+ -> big. Radius in metres so it scales with the map.
    const m = 120 + Math.min(n, 12) * 55;
    DENS.addLayer(L.circle([c.lat, c.lon], { radius: m, stroke: false, fillColor: '#A11A17', fillOpacity: .16, interactive: false }));
    // the reader itself, so the field still has its points
    DENS.addLayer(L.circleMarker([c.lat, c.lon], { radius: 2.2, stroke: false, fillColor: '#E2635C', fillOpacity: .9, interactive: false }));
  }
  densBuilt = true;
}
function syncDensity(want) {
  if (want) {
    if (!densBuilt) buildDensity();
    if (!map.hasLayer(DENS)) DENS.addTo(map);
  } else if (map.hasLayer(DENS)) map.removeLayer(DENS);
}

function select(id, move) {
  const prev = byId(CUR);
  if (prev && MARK[CUR]) MARK[CUR].setIcon(pinIcon(prev.direction, false));
  CUR = id;
  const c = byId(id), m = MARK[id];
  if (!c || !m) return;
  m.setIcon(pinIcon(c.direction, true));
  // Below PIN_ZOOM the marker isn't on the map yet; put it there so the popup has an anchor.
  if (!map.hasLayer(m)) m.addTo(map);
  if (move) fly([c.lat, c.lon], Math.max(map.getZoom(), 17), .6);
  m.openPopup();
  KB = ROWS.findIndex(r => r.id === id);
  markRows();
  // The address bar names the selected reader, so the page can be sent as it is being read.
  // replaceState, not a hash assignment: arrowing down the list shouldn't fill the Back button.
  try { history.replaceState(null, '', '#cam=' + encodeURIComponent(id)); } catch (e) {}
}
const linkTo = id => location.origin + location.pathname + '#cam=' + encodeURIComponent(id);

// A link someone was sent, or one pasted into the bar of an open tab.
function fromHash(fly) {
  const m = /[#&]cam=([^&]+)/.exec(location.hash);
  if (!m) return false;
  const id = decodeURIComponent(m[1]);
  if (!BYID.has(id)) { say('That link points at a reader this copy does not have.', true); return false; }
  select(id, fly);
  return true;
}
addEventListener('hashchange', () => fromHash(true));
const byId = id => BYID.get(id) || null;

// Only the two rows whose state changed are touched, not all 200.
function markRows() {
  $('#list').querySelectorAll('.li').forEach(el => {
    const on = el.dataset.id === CUR;
    el.classList.toggle('on', on);
    el.setAttribute('aria-selected', on ? 'true' : 'false');
    el.classList.toggle('kb', ARROWED && KB >= 0 && !!ROWS[KB] && el.dataset.id === ROWS[KB].id);
    if (on) el.scrollIntoView({ block: 'nearest' });
  });
}

// Arrow keys walk the list from the search box; Escape backs out one step at a time.
function step(n) {
  if (!ROWS.length) return;
  KB = KB < 0 ? (n > 0 ? 0 : ROWS.length - 1) : Math.min(ROWS.length - 1, Math.max(0, KB + n));
  ARROWED = true;
  select(ROWS[KB].id, true);
}

function render(q) {
  const list = $('#list');
  q = (q || '').trim().toLowerCase();
  // c.find is built once at boot from the fields that exist, so a missing operator
  // can no longer put the literal word "undefined" into the haystack.
  let rows = CAMS.filter(c => opMatch(c) && (!q || c.find.includes(q)));
  if (HOME) rows = rows.slice().sort((a, b) => milesTo(a) - milesTo(b));
  syncLayers();

  const nl = $('#nearlab');
  if (nl) nl.innerHTML = HOME ? `from <b>${esc(HOME.name)}</b><a title="Stop measuring" id="clearhome" role="button" tabindex="0">✕</a>` : '';
  if (nl && HOME) $('#clearhome').onclick = clearHome;

  ROWS = rows;
  KB = CUR ? rows.findIndex(r => r.id === CUR) : -1;
  ARROWED = false;   // the list moved under it; Enter goes back to meaning "look this address up"
  $('#count').textContent = (rows.length !== CAMS.length ? rows.length + ' of ' : '') + CAMS.length + ' cameras';

  if (!rows.length) {
    const why = q && OP !== 'all' ? `Nothing matches “${esc(q)}” under ${esc(OP)}.`
              : q ? `Nothing matches “${esc(q)}”.`
              : `No cameras under ${esc(OP)}.`;
    list.innerHTML = `<div class="empty">${why}<br><button id="resetf">Clear the filters</button></div>`;
    $('#resetf').onclick = resetFilters;
    return;
  }

  let town = null, html = '';
  for (const c of rows) {
    if (!HOME) {
      const t = c.city || 'Unplaced';
      if (t !== town) { town = t; html += `<div class="town">${esc(t)}</div>`; }
    }
    const d = HOME ? `<b>${fmtMi(milesTo(c))}</b>${esc(dirText(c.direction))}` : esc(dirText(c.direction));
    html += `<div class="li${c.id === CUR ? ' on' : ''}" data-id="${c.id}" role="option" aria-selected="${c.id === CUR}">
      <span class="a">${esc(c.label)}</span>
      <span class="d">${d}</span>
      ${c.operator ? `<span class="s">${esc(c.operator)}</span>` : ''}
    </div>`;
  }
  list.innerHTML = html;
}

// One click handler on the container, attached once — not 200 rebuilt per keystroke.
$('#list').addEventListener('click', e => {
  const el = e.target.closest('.li');
  if (el) { ARROWED = false; select(el.dataset.id, true); }
});

function resetFilters() {
  OP = 'all';
  $('#q').value = '';
  $('#chips').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.op === 'all'));
  render('');
  $('#q').focus();
}

// The data is baked into this file so it opens with no server and no signal (see flock.publish.py).
// On the Mission Control copy it is fetched instead, so a rebuild shows up on reload.
function boot(d) {
  CAMS = d.cameras || [];
  BYID = new Map(CAMS.map(c => [c.id, c]));
  const group = L.featureGroup();
  for (const c of CAMS) {
    // one lowercase haystack per camera, built from the fields that exist
    c.find = [c.label, c.operator, c.postcode, c.city, c.road].filter(Boolean).join(' ').toLowerCase();
    const m = L.marker([c.lat, c.lon], { icon: pinIcon(c.direction, false), title: c.label }).bindPopup(popupHtml(c)).on('click', () => select(c.id, false));
    MARK[c.id] = m; group.addLayer(m);
    CONE[c.id] = coneFor(c);          // added to the map by syncLayers, once the zoom warrants it
  }
  group.addTo(map);
  if (CAMS.length) map.fitBounds(group.getBounds().pad(.05));
  buildChips();
  render('');
  document.title = `Flock — ${CAMS.length} plate readers`;
  // How old this snapshot is, said out loud — a stale copy on a phone looks identical to a fresh one.
  if (d.built) $('#built').textContent = 'as of ' + d.built.slice(0, 10);
  // A shared link wins over the fitted bounds, but only after the map has settled.
  if (location.hash) setTimeout(() => fromHash(true), 50);
}
(function () {
  const raw = $('#data').textContent.trim();
  if (raw && raw !== '__DATA__') { try { return boot(JSON.parse(raw)); } catch (e) {} }
  fetch('flock.data.json', { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(boot).catch(err => {
    $('#list').innerHTML = `<div class="empty">No camera data yet. Run <code>flock.build.py</code> in the mission-control folder, then reload.<br><small>${esc(err.message)}</small></div>`;
  });
})();
// ---- "Save to phone"
// The menu wording moves around between phone and browser versions; the icons don't.
// So each step is the icon you are looking for, drawn, plus one sentence.
const ART = {
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m8 7 4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>',
  plus:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2.5" width="18" height="19" rx="3.5"/><path d="M12 9v6M9 12h6"/></svg>',
  dots:  '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>',
  down:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M12 7.5v6.5"/><path d="m9.5 11.5 2.5 2.5 2.5-2.5"/></svg>',
};
const GUIDE = {
  ios: [
    { art: 'share', t: 'In Safari, tap this button. It sits in the bar at the <em>bottom</em> of the screen.' },
    { art: 'plus',  t: 'Scroll that list down and tap <em>Add to Home Screen</em>, then Add.' },
  ],
  android: [
    { art: 'dots',  t: 'In Chrome, tap these three dots at the <em>top right</em>.' },
    { art: 'down',  t: 'Tap <em>Install app</em>, or <em>Add to Home screen</em>, then Install.' },
  ],
};
const sheet = $('#sheet');
let OS = /iphone|ipad|ipod/i.test(navigator.userAgent) ? 'ios'
       : /android/i.test(navigator.userAgent) ? 'android'
       : (navigator.maxTouchPoints > 1 && /macintosh/i.test(navigator.userAgent) ? 'ios' : 'android');

function drawGuide() {
  $('#steps').innerHTML = GUIDE[OS].map((s, i) => `
    <div class="step">
      <div class="art">${ART[s.art]}</div>
      <div><div class="n">Step ${i + 1}</div><p>${s.t}</p></div>
    </div>`).join('');
  sheet.querySelectorAll('.sheet-t button').forEach(b => b.classList.toggle('on', b.dataset.os === OS));
}
sheet.querySelectorAll('.sheet-t button').forEach(b => b.onclick = () => { OS = b.dataset.os; drawGuide(); });
$('#sheet-x').onclick = () => sheet.close();
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });   // tap the backdrop
$('#install').onclick = () => { drawGuide(); sheet.showModal(); };

// Chrome can do it in one tap; when it offers, take the offer and keep the pictures as the fallback.
let PROMPT = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); PROMPT = e; $('#doinstall').hidden = false; });
$('#doinstall').onclick = async () => {
  if (!PROMPT) return;
  sheet.close();
  PROMPT.prompt();
  await PROMPT.userChoice;
  PROMPT = null; $('#doinstall').hidden = true;
};
// Nothing to offer once it is already on the home screen.
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
$('#install').hidden = standalone;
addEventListener('appinstalled', () => { $('#install').hidden = true; sheet.close(); });

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
