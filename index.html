<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171213">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flock">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Flock — Charleston plate readers</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  /* Greyscale first, then one warm accent (design-taste §11a). Amber is the emblem's bolt and
     it is the only colour on the chrome. Red stays for the readers themselves on the map, so the
     two never compete: amber = you and your controls, red = them. Depth is value, then two
     cheap shadows on anything raised — a contact shadow and a soft lift, same light for all. */
  :root{
    --wall:#171213; --card:#242323; --key:#302D2C; --chosen:#3D3837; --sink:#191616;
    --line:rgba(210,206,199,.10); --line2:rgba(210,206,199,.16);
    --ink:#D2CEC7; --ink2:#A29E98; --ink3:#6F6B66;
    --red:#A11A17; --red-tx:#E2635C;
    --amber:#D68A3E; --amber-tx:#E9A75B; --amber-dim:rgba(214,138,62,.14);
    --lift:0 1px 0 rgba(255,255,255,.04) inset, 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.6);
    --r:10px; --r-s:8px; --r-pill:999px;
    --font:ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
    --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  /* dvh, where it exists, so the phone's shrinking address bar doesn't crop the list */
  @supports (height:100dvh){html,body{height:100dvh}}
  body{background:var(--wall);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;
       display:grid;grid-template-rows:auto 1fr;overflow:hidden;padding-top:var(--sat)}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  header{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--card)}
  header .mark{width:30px;height:30px;flex:none;color:var(--ink);border-radius:50%;box-shadow:0 0 0 1px var(--line2),0 0 18px -4px var(--amber-dim)}
  header b{font-size:16px;letter-spacing:-.01em}
  header small{color:var(--ink3);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  header .n{font:12px var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
  header #lang{margin-left:auto;font:inherit;font-size:12px;color:var(--ink2);background:var(--key);border:1px solid var(--line);
               border-radius:var(--r-s);padding:5px 6px;cursor:pointer}
  header #lang:hover{color:var(--ink)}

  .app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;min-height:0}
  .grip{display:none}
  aside{display:grid;grid-template-rows:auto auto auto auto 1fr;min-height:0;border-right:1px solid var(--line);background:var(--card)}

  .find{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 12px 6px}
  .find input{flex:1 1 auto}
  .find #near,.find #units{flex:none}
  .find #units{font:12px var(--mono);color:var(--ink2);padding:9px 8px;min-width:38px}
  .find #units:hover{color:var(--ink)}
  .find input{width:100%;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--sink);color:var(--ink);font:inherit;min-width:0;box-shadow:inset 0 1px 2px rgba(0,0,0,.35);transition:border-color .15s,box-shadow .15s}
  .find input::placeholder{color:var(--ink3)}
  .find input:focus{outline:none;border-color:var(--amber);box-shadow:inset 0 1px 2px rgba(0,0,0,.35),0 0 0 3px var(--amber-dim)}
  /* one line under the box for lookup progress and failures, in place of alert() */
  .status{flex-basis:100%;font-size:12px;color:var(--ink2);min-height:0;padding:2px 2px 0}
  .status:empty{display:none}
  .status.bad{color:var(--red-tx)}
  .status:not(.bad){color:var(--amber-tx)}
  button{font:inherit;color:var(--ink);background:var(--key);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;cursor:pointer;white-space:nowrap;box-shadow:var(--lift);transition:background .15s,border-color .15s,color .15s}
  button:hover{background:var(--chosen)}
  button.on{background:var(--chosen);font-weight:600;border-color:var(--amber);color:var(--amber-tx)}
  button[disabled]{opacity:.5;cursor:default}
  button.busy{color:transparent;position:relative}
  button.busy::after{content:"";position:absolute;inset:0;margin:auto;width:12px;height:12px;border:2px solid var(--ink3);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .chips{display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .chips button{padding:5px 10px;font-size:12px;border-radius:var(--r-pill);box-shadow:none}
  .chips button small{color:var(--ink3);font-weight:400;margin-left:2px}
  .chips button.on small{color:var(--amber-tx);opacity:.8}
  .chips button.on{color:var(--amber-tx);background:var(--amber-dim)}
  .chips .sp{flex:1}
  .chips .near{font-size:12px;color:var(--ink2);align-self:center;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .chips .near b{color:var(--ink);font-weight:600}
  .chips .near a{color:var(--ink3);text-decoration:none;margin-left:6px;cursor:pointer}
  .chips .near a:hover{color:var(--ink)}

  /* Tip bar: what people actually do about these, one line at a time. */
  .tipbar{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px;padding:8px 12px;
          border-bottom:1px solid var(--line);background:var(--sink)}
  .tipbar[hidden]{display:none}
  .tipbar .bulb{width:16px;height:16px;color:var(--amber-tx);flex:none}
  .tipbar p{margin:0;font-size:12px;color:var(--ink2);cursor:pointer;
            display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tipbar p:hover{color:var(--ink)}
  .tipbar .nav{display:flex;gap:2px}
  .tipbar button{padding:2px 7px;font-size:12px;background:transparent;border:0;box-shadow:none;color:var(--ink3);border-radius:var(--r-s)}
  .tipbar button:hover{background:var(--key);color:var(--ink)}
  .tiplist{display:grid;gap:0;padding:0 16px 8px}
  .tiplist li{list-style:none;padding:11px 0;border-top:1px solid var(--line);font-size:13px;color:var(--ink)}
  .tiplist li:first-child{border-top:0}
  .tiplist a{color:var(--amber-tx);text-decoration:none;font-size:11.5px;display:inline-block;margin-top:3px}
  .tiplist a:hover{text-decoration:underline}
  .tiplist li.law{color:var(--red-tx)}

  .list{overflow:auto;overscroll-behavior:contain;padding:6px 0;scrollbar-width:thin;scrollbar-color:var(--key) transparent;-webkit-overflow-scrolling:touch}
  .town{position:sticky;top:0;z-index:1;padding:8px 14px 4px;font:600 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);background:var(--card)}
  .li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 14px;cursor:pointer;border-left:2px solid transparent;transition:background .12s}
  .li:hover{background:var(--key)}
  .li.on{background:var(--chosen);border-left-color:var(--amber)}
  .li .a{font-weight:500}
  .li.on .a{font-weight:600}
  .li .s{grid-column:1/-1;font-size:12px;color:var(--ink2)}
  .li .d{font:11px var(--mono);color:var(--ink3);align-self:start;padding-top:2px;font-variant-numeric:tabular-nums;text-align:right}
  .li .d b{display:block;color:var(--ink2);font-weight:600}
  .li.on .d,.li.on .s{color:var(--ink)}
  .li.on .d b{color:var(--amber-tx)}
  .li.kb{background:var(--key)}
  .empty{padding:24px 14px;color:var(--ink3);text-align:center}
  .empty code{color:var(--ink2)}
  .empty button{margin-top:12px;font-size:12px;padding:7px 12px}
  .skel{height:38px;margin:6px 14px;border-radius:6px;background:linear-gradient(90deg,var(--key),var(--chosen),var(--key));background-size:200% 100%;animation:sk 1.2s linear infinite}
  @keyframes sk{to{background-position:-200% 0}}

  .mapwrap{position:relative;min-height:0;display:grid}
  #map{min-height:0;background:var(--sink)}
  .leaflet-container{font:inherit;background:var(--sink)}
  .pin{width:16px;height:16px;position:relative}
  .pin i{position:absolute;inset:3px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--wall)}
  .pin.on i{background:var(--red-tx);box-shadow:0 0 0 2px var(--wall),0 0 0 6px rgba(226,99,92,.25)}
  .pin s{position:absolute;left:7px;top:-7px;width:2px;height:10px;background:var(--red-tx);transform-origin:1px 15px;border-radius:1px}
  .pin.on s{background:#fff}
  .me{width:22px;height:22px;position:relative}
  .me::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px var(--wall),0 0 0 6px var(--amber-dim)}
  .me .hd{position:absolute;left:8px;top:-8px;width:6px;height:14px;transform-origin:3px 19px;display:none}
  .me .hd::before{content:"";position:absolute;left:0;top:0;border:3px solid transparent;border-bottom:9px solid var(--amber-tx);border-top:0}
  .leaflet-popup-content-wrapper{border-radius:var(--r);border:1px solid var(--line2)}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--ink);box-shadow:var(--lift)}
  .leaflet-popup-content{margin:10px 12px;font-size:13px;line-height:1.4}
  .leaflet-popup-content b{display:block;font-size:14px}
  .leaflet-popup-content small{color:var(--ink2);display:block}
  .leaflet-popup-content .acts{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px}
  .leaflet-popup-content a{color:var(--amber-tx);text-decoration:none;font-size:12px}
  .leaflet-popup-content a:hover{text-decoration:underline}
  .leaflet-popup-content a.fix{color:var(--ink3)}
  .leaflet-popup-content a.fix:hover{color:var(--ink2)}
  .addpop .leaflet-popup-content-wrapper{border-color:var(--amber)}
  .leaflet-control-zoom{border:0!important;box-shadow:var(--lift)!important;border-radius:var(--r-s)!important;overflow:hidden}
  .leaflet-control-zoom a{background:var(--card)!important;color:var(--ink)!important;border-color:var(--line)!important;width:32px!important;height:32px!important;line-height:30px!important}
  .leaflet-control-attribution{background:rgba(23,18,19,.75)!important;color:var(--ink3)!important;font-size:10px}
  .leaflet-control-attribution a{color:var(--ink2)!important}
  .leaflet-tile-pane{filter:brightness(.72) contrast(1.05) saturate(.7)}
  .leaflet-container.sat .leaflet-tile-pane{filter:none}

  /* "Save to phone": what to tap, drawn rather than described, because the wording of
     these menu items differs between phones but the icons do not. */
  .built{color:var(--ink3);font-size:11px;white-space:nowrap}
  button.ghost{background:transparent;border-color:var(--line);color:var(--ink2);font-size:12px;padding:5px 10px;box-shadow:none}
  button.ghost:hover{background:var(--key);color:var(--ink)}
  dialog#sheet{border:1px solid var(--line2);border-radius:16px;background:var(--card);color:var(--ink);
               padding:0;width:min(420px,calc(100vw - 28px));max-height:86vh;overflow:auto;box-shadow:var(--lift),0 24px 64px -24px rgba(0,0,0,.8)}
  dialog#sheet::backdrop{background:rgba(0,0,0,.55)}
  .sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
  .sheet-h b{font-size:15px}
  .sheet-h button{margin-left:auto;padding:4px 9px;font-size:12px}
  .sheet-t{display:flex;gap:6px;padding:0 16px 12px}
  .sheet-t button{flex:1;font-size:12px;padding:6px 8px}
  .steps{display:grid;gap:2px;padding:0 16px 16px}
  .step{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
  .step .art{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;background:var(--sink);border:1px solid var(--line);color:var(--ink)}
  .step .art svg{width:24px;height:24px}
  .step .n{font:600 10.5px/1 var(--mono);letter-spacing:.14em;color:var(--ink3);text-transform:uppercase}
  .step p{margin:3px 0 0;font-size:13px;color:var(--ink)}
  .step p em{font-style:normal;color:var(--amber-tx)}
  .sheet-f{padding:0 16px 16px;font-size:12px;color:var(--ink3)}
  .sheet-f button{width:100%;margin-bottom:10px;font-size:13px;padding:10px}

  /* Where-am-I, on the map itself. The list has "Near me", but that is off screen once the
     list is scrolled, and this is where a hand already is on a phone. */
  .locate{position:absolute;right:10px;bottom:22px;z-index:500;width:42px;height:42px;padding:0;
          display:grid;place-items:center;border-radius:50%;background:var(--card);color:var(--ink2);box-shadow:var(--lift)}
  .locate svg{width:20px;height:20px}
  .locate:hover{background:var(--chosen);color:var(--ink)}
  .locate.held{color:var(--ink)}
  .locate.on{color:var(--amber-tx);border-color:var(--amber)}
  .locate.on .ring{opacity:1}
  .locate .ring{opacity:0;transition:opacity .2s}
  .locate.busy{color:transparent}
  .locate.busy::after{border-color:var(--ink3);border-top-color:var(--ink)}

  /* minmax(0,1fr): without it the grid sizes its column to the widest row and the
     buttons hang off the edge of the box on a phone. */
  .trip-body{padding:0 16px 16px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
  .trip-body .fld{display:grid;gap:5px}
  .trip-body label{font:600 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
  .trip-body .row{display:flex;gap:6px;align-items:center;min-width:0}
  .trip-body input{flex:1 1 auto;min-width:0;padding:10px 12px;border-radius:var(--r);border:1px solid var(--line);
                   background:var(--sink);color:var(--ink);font:inherit;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
  .trip-body input:focus{outline:none;border-color:var(--amber);box-shadow:inset 0 1px 2px rgba(0,0,0,.35),0 0 0 3px var(--amber-dim)}
  .trip-body .row button{flex:none;font-size:12px;padding:9px 10px}
  #from-me{width:38px;display:grid;place-items:center;padding:0}
  #from-me svg{width:17px;height:17px}
  #swap{justify-self:start;padding:4px 10px;font-size:12px;box-shadow:none;color:var(--ink2)}
  .seg{display:flex;gap:1px;min-width:0;background:var(--line2);border-radius:var(--r-s);overflow:hidden}
  .seg button{flex:1 1 0;min-width:0;border:0;border-radius:0;background:var(--key);color:var(--ink2);font-size:12px;padding:9px 4px;box-shadow:none}
  .seg button.on{background:var(--chosen);color:var(--amber-tx);font-weight:600}
  .go{width:100%;padding:12px;font-weight:600;border-color:var(--amber);color:var(--amber-tx);background:var(--amber-dim)}
  .go:hover{background:var(--chosen)}
  #tripstatus{padding:0}

  /* Route planner: same round control as locate, sitting above it. */
  .plan{position:absolute;right:10px;bottom:72px;z-index:500;width:42px;height:42px;padding:0;
        display:grid;place-items:center;border-radius:50%;background:var(--card);color:var(--ink2);box-shadow:var(--lift)}
  .plan svg{width:20px;height:20px}
  .plan:hover{background:var(--chosen);color:var(--ink)}
  .plan.on{color:var(--amber-tx);border-color:var(--amber)}
  .plan.busy{color:transparent}
  .plan.busy::after{border-color:var(--ink3);border-top-color:var(--ink)}

  .routes{position:absolute;left:10px;right:64px;bottom:12px;z-index:500;background:var(--card);border:1px solid var(--line);
          border-radius:var(--r);box-shadow:var(--lift);padding:8px;display:none}
  .routes.show{display:block}
  .routes-h{display:flex;align-items:center;gap:6px;padding:0 2px 7px}
  .routes-h b{font-size:12.5px}
  .routes-h .sp{flex:1}
  .routes-h button{padding:4px 9px;font-size:11.5px;box-shadow:none;border-radius:var(--r-pill)}
  .opt{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;
       padding:8px 10px;border-radius:var(--r-s);border:1px solid transparent;background:var(--sink);margin-top:5px;box-shadow:none}
  .opt:hover{background:var(--key)}
  .opt.on{border-color:var(--amber);background:var(--amber-dim)}
  .opt .w{font-size:12.5px;font-weight:600}
  .opt.on .w{color:var(--amber-tx)}
  .opt .m{font:11px var(--mono);color:var(--ink3);font-variant-numeric:tabular-nums}
  .opt .c{grid-column:1/-1;font-size:11.5px;color:var(--ink2)}
  .opt .c.clean{color:var(--amber-tx)}

  .layers{position:absolute;right:10px;top:10px;z-index:500;display:flex;gap:1px;background:var(--line2);border-radius:var(--r-s);overflow:hidden;box-shadow:var(--lift)}
  .layers button{border:0;border-radius:0;padding:7px 11px;background:var(--card);color:var(--ink2);font-size:12px;box-shadow:none}
  .layers button.on{background:var(--chosen);color:var(--amber-tx)}

  /* phone: list under a shorter map, both scrollable, nothing under the home bar */
  @media (max-width:760px){
    .app{grid-template-columns:1fr;grid-template-rows:minmax(180px,1fr) auto}
    /* The bar you can grab: tap it to swap between half and tall, drag it to anywhere. */
    .grip{display:block;width:100%;padding:7px 0 3px;background:transparent;border:0;box-shadow:none;
          border-radius:0;cursor:grab;touch-action:none}
    .grip span{display:block;width:38px;height:4px;margin:0 auto;border-radius:999px;background:var(--line2)}
    .grip:hover span{background:var(--ink3)}
    aside{border-right:0;border-top:1px solid var(--line);grid-row:2;max-height:55vh;padding-bottom:var(--sab);
          transition:max-height .3s cubic-bezier(.2,.7,.3,1)}
    @supports (height:100dvh){aside{max-height:55dvh}}
    /* Reading the list means wanting the list. Scrolling it takes the map down to about half
       and gives the room to the rows; going back to the top puts the map back. */
    .app.grown{grid-template-rows:minmax(96px,1fr) auto}
    .app.grown aside{max-height:74vh}
    @supports (height:100dvh){.app.grown aside{max-height:74dvh}}
    /* The address box gives up its slack so Near me sits well inside the screen. */
    .find input{flex:0 1 58%}
    .locate{bottom:12px;right:8px}
    .plan{bottom:64px;right:8px}
    .routes{left:8px;right:60px;bottom:8px;padding:7px}
    .mapwrap{grid-row:1}
    header small:not(.built){display:none}   /* the strapline goes; how old the data is stays */
    header{gap:6px;padding:10px 10px}
    header #lang{padding:5px 4px}
    /* The chips already say "All 200", so the header total is the first thing to go. */
    @media (max-width:480px){ header .n{display:none} }
    .li{padding:13px 14px;min-height:44px;align-content:center}
    .chips button{padding:8px 12px;min-height:36px}
    .tipbar button{min-width:34px;min-height:34px}
    .find input{padding:12px}
    #near{min-height:44px}
    .chips{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
    .chips::-webkit-scrollbar{display:none}
    .chips .sp{display:none}
    .layers{top:8px;right:8px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
  }
</style>
</head>

<div class="app">
  <aside>
    <div class="find">
      <input id="q" type="search" placeholder="Street, town, or an address to measure from" autocomplete="off" enterkeyhint="search"
             aria-label="Filter the list, or press Enter to measure distances from an address" aria-describedby="status">
      <button id="near" title="Sort by distance from where you are">Near me</button>
      <button id="units" title="Miles or kilometres">mi</button>
      <div class="status" id="status" role="status"></div>
    </div>
    <button class="grip" id="grip" aria-label="Make the list taller or shorter"><span></span></button>
    <div class="chips" id="chips"></div>
    <div class="tipbar" id="tipbar">
      <svg class="bulb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 18h6M10 21.5h4"/><path d="M12 2.5a6.5 6.5 0 0 0-3.8 11.8c.5.4.8 1 .8 1.7h6c0-.7.3-1.3.8-1.7A6.5 6.5 0 0 0 12 2.5Z"/>
      </svg>
      <p id="tiptext" role="button" tabindex="0"></p>
      <span class="nav"><button id="tipprev" aria-label="Previous tip">‹</button><button id="tipnext" aria-label="Next tip">›</button></span>
      <button id="tipx" aria-label="Hide tips">✕</button>
    </div>
    <div class="list" id="list" role="listbox" aria-label="Plate readers"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </aside>
  <div class="mapwrap">
    <div class="layers"><button data-l="map" class="on">Map</button><button data-l="sat">Satellite</button></div>
    <button id="locate" class="locate" title="Show where you are" aria-label="Show where you are">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <circle class="ring" cx="12" cy="12" r="9.2" stroke-dasharray="3 4"/>
        <circle cx="12" cy="12" r="3.4"/><path d="M12 1.6v3.2M12 19.2v3.2M1.6 12h3.2M19.2 12h3.2"/>
      </svg>
    </button>
    <button id="plan" class="plan" title="Plan a route that avoids the cameras" aria-label="Plan a route that avoids the cameras">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5.5 20c0-4 3.2-4.6 3.2-7.4S5.6 9.4 5.6 6.6 8.4 3 11.5 3h4"/>
        <path d="m13.8 1.4 2.2 1.6-2.2 1.6"/><circle cx="18.4" cy="17.6" r="2.6"/>
      </svg>
    </button>
    <div class="routes" id="routes" role="group" aria-label="Routes"></div>
    <div id="map"></div>
  </div>
</div>

<dialog id="trip" aria-labelledby="trip-title">
  <div class="sheet-h"><b id="trip-title">Find a route</b><button id="trip-x">Close</button></div>
  <div class="trip-body">
    <div class="fld">
      <label id="l-from" for="from">From</label>
      <div class="row">
        <input id="from" autocomplete="off" placeholder="Where you are">
        <button id="from-me" title="Use my location" aria-label="Use my location">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.4"/><path d="M12 1.6v3.2M12 19.2v3.2M1.6 12h3.2M19.2 12h3.2"/></svg>
        </button>
        <button id="from-pick" data-pick="from">Pick on map</button>
      </div>
    </div>
    <button id="swap" title="Swap them">⇅</button>
    <div class="fld">
      <label id="l-to" for="to">To</label>
      <div class="row">
        <input id="to" autocomplete="off" placeholder="Street, town, or address">
        <button id="to-pick" data-pick="to">Pick on map</button>
      </div>
    </div>
    <div class="fld">
      <label id="l-how">How you are going</label>
      <div class="seg" id="modes">
        <button data-m="run">Run</button><button data-m="walk">Walk</button><button data-m="bike">Bike</button><button data-m="drive">Drive</button>
      </div>
    </div>
    <div class="fld">
      <label id="l-wide">How wide to steer around them</label>
      <div class="seg" id="widths">
        <button data-w="close">Closer</button><button data-w="normal">Normal</button><button data-w="wide">Wider</button>
      </div>
    </div>
    <div class="status" id="tripstatus" role="status"></div>
    <button id="go" class="go">Find routes</button>
  </div>
</dialog>

<dialog id="tips" aria-labelledby="tips-title">
  <div class="sheet-h"><b id="tips-title">What people do about these</b><button id="tips-x">Close</button></div>
  <ul class="tiplist" id="tiplist"></ul>
</dialog>

<dialog id="sheet" aria-labelledby="sheet-title">
  <div class="sheet-h"><b id="sheet-title">Keep Flock on your phone</b><button id="sheet-x">Close</button></div>
  <div class="sheet-t">
    <button data-os="ios">iPhone</button>
    <button data-os="android">Android</button>
  </div>
  <div class="steps" id="steps"></div>
  <div class="sheet-f">
    <button id="doinstall" hidden>Install it now</button>
    <span id="sheet-foot">It opens from the home screen like an app, and the streets you have already looked at still work with no signal.</span>
  </div>
</dialog>

    'What people do about these': 'O que as pessoas fazem sobre isso',
    'Johnson County\u2019s sheriff has run a county plate-reader network since 2022, under a $595,000 contract for up to 55 readers, and images are kept for as long as two years.': 'O xerife do condado de Johnson mant\u00e9m uma rede de leitores desde 2022, com um contrato de US$ 595 mil para at\u00e9 55 c\u00e2meras, e as imagens ficam guardadas por at\u00e9 dois anos.',
    'Kansas has no state law setting how long police may keep plate-reader data or who they may share it with. Each agency writes its own policy.': 'O Kansas n\u00e3o tem lei estadual dizendo por quanto tempo a pol\u00edcia pode guardar esses dados nem com quem pode compartilhar. Cada ag\u00eancia escreve a pr\u00f3pria regra.',
    'Kansas open records law specifically exempts captured plate data, and the location of the cameras themselves, from public disclosure.': 'A lei de acesso do Kansas exclui expressamente os dados das placas capturadas, e a localiza\u00e7\u00e3o das pr\u00f3prias c\u00e2meras, da divulga\u00e7\u00e3o p\u00fablica.',
    'Lenexa police ran one resident\u2019s plate about 150 times in under two years, after he published a column critical of the department.': 'A pol\u00edcia de Lenexa consultou a placa de um morador cerca de 150 vezes em menos de dois anos, depois de ele publicar um texto criticando o departamento.',
    'A Bonner Springs detective was charged in March 2026 with using plate readers to track his estranged wife and two men he suspected she was seeing.': 'Um detetive de Bonner Springs foi denunciado em mar\u00e7o de 2026 por usar os leitores para seguir a mulher de quem estava separado e dois homens de quem ele suspeitava.',
    'Councils do change their minds. Weston, Missouri approved $45,000 for two Flock cameras in December 2025 and cancelled the contract five months later.': 'C\u00e2maras municipais mudam de ideia. Weston, no Missouri, aprovou US$ 45 mil para duas c\u00e2meras Flock em dezembro de 2025 e cancelou o contrato cinco meses depois.',
    'There is no personal opt-out. Flock describes agency-level controls only, so the lever is the city contract, not a setting.': 'Não existe opção de sair individualmente. A Flock descreve apenas controles no nível da agência, então a alavanca é o contrato da cidade, não uma configuração.',
    'Recordings run on a timer. Communities have commonly deleted after 30 days, and the default dropped to 7 days in August 2026 — though existing customers keep their own setting.': 'As gravações têm prazo. As cidades costumavam apagar depois de 30 dias, e o padrão caiu para 7 dias em agosto de 2026 — mas clientes antigos mantêm a própria configuração.',
    'You can ask for the paperwork. South Carolina FOIA gives agencies 15 business days, and there are ready-made request templates for contracts, retention policy and camera locations.': 'Você pode pedir os documentos. A lei de acesso da Carolina do Sul dá 15 dias úteis às agências, e existem modelos prontos de pedido para contratos, política de retenção e locais das câmeras.',
    'Search logs released under records requests have been gathered into a public search tool.': 'Registros de buscas obtidos por pedidos de acesso foram reunidos em uma ferramenta pública de consulta.',
    'Towns do drop them. 95 US jurisdictions have rejected or removed plate-reader systems, and Ypsilanti, Michigan banned them outright.': 'Cidades realmente desistem delas. 95 jurisdições nos EUA rejeitaram ou removeram sistemas de leitura de placas, e Ypsilanti, no Michigan, proibiu de vez.',
    'More than 1,500 agencies publish a transparency portal listing their retention period, sharing partners and how many searches they ran.': 'Mais de 1.500 agências publicam um portal de transparência com o prazo de retenção, com quem compartilham e quantas buscas fizeram.',
    'Around here, Charleston, North Charleston and Mount Pleasant police all use Flock. Mount Pleasant runs 22 cameras and audits them monthly.': 'Por aqui, as polícias de Charleston, North Charleston e Mount Pleasant usam Flock. Mount Pleasant tem 22 câmeras e faz auditoria mensal.',
    'Misuse gets people fired. A Mauldin officer was fired in 2026 after searching a former partner’s plate 166 times.': 'O uso indevido custa o emprego. Um policial de Mauldin foi demitido em 2026 depois de consultar a placa de uma ex-companheira 166 vezes.',
    'EFF obtained records of more than 12 million searches by over 3,900 agencies between December 2024 and October 2025.': 'A EFF obteve registros de mais de 12 milhões de buscas feitas por mais de 3.900 agências entre dezembro de 2024 e outubro de 2025.',
    'Congress opened an investigation after reporting on immigration-related searches, and Flock then blocked out-of-state lookups in three states.': 'O Congresso abriu uma investigação após reportagens sobre buscas ligadas à imigração, e a Flock passou a bloquear consultas de fora em três estados.',

let LANG = localStorage.getItem('flock.lang');
if (!LANG || !(LANG in LANGS)) LANG = (navigator.language || 'en').slice(0, 2).toLowerCase();
if (!(LANG in LANGS)) LANG = 'en';
function T(s, vars) {
  let out = (LANG !== 'en' && DICT[LANG] && DICT[LANG][s]) || s;
  if (vars) out = out.replace(/\{(\w+)\}/g, (m, k) => (vars[k] == null ? m : vars[k]));
  return out;
}

// Honour the OS setting for map flights too, not just CSS animation. A hidden tab gets
// no animation frames, so a link opened in the background would otherwise never arrive:
// jump there instead, and it is already in place when the tab is looked at.
const CALM = matchMedia('(prefers-reduced-motion: reduce)');
const PHONE = matchMedia('(max-width:760px)');
const fly = (latlng, zoom, secs) => {
  const z = zoom == null ? map.getZoom() : zoom;
  return (CALM.matches || document.hidden)
    ? map.setView(latlng, z, { animate: false })
    : map.flyTo(latlng, z, { duration: secs });
};

// One line under the search box. Beats alert(), which a standalone PWA renders badly.
let statusTimer = null;
function say(msg, bad) {
  const el = $('#status');
  el.textContent = msg || '';
  el.classList.toggle('bad', !!bad);
  clearTimeout(statusTimer);
  if (msg) statusTimer = setTimeout(() => { el.textContent = ''; el.classList.remove('bad'); }, 6000);
}

// preferCanvas: the cones and density discs become one canvas rather than hundreds of
// SVG nodes, which is the difference between smooth and juddering panning on a phone.
const map = L.map('map', { zoomControl: true, preferCanvas: true })
  .setView([32.82, -79.95], 10);
const street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imagery &copy; Esri' });
document.querySelectorAll('.layers button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.layers button').forEach(x => x.classList.toggle('on', x === b));
  const isSat = b.dataset.l === 'sat';
  map.removeLayer(isSat ? street : sat); map.addLayer(isSat ? sat : street);
  map.getContainer().classList.toggle('sat', isSat);
});

let CAMS = [], MARK = {}, CONE = {}, CUR = null, BUILT = '';
// Which town this copy was built for. Set from the data at boot; the Charleston build
// predates the field, so that is the fallback.
let AREA = 'charleston', AREA_LABEL = 'Charleston';
let BYID = new Map();                             // id -> camera, so lookups aren't a scan
let ROWS = [];                                    // what the list is showing, in order
let KB = -1;                                      // arrow-key position within ROWS
let ARROWED = false;                              // true only while arrow keys are steering
let HOME = null, HOMEMARK = null, RING = null;   // where distances are measured from
let OP = 'all';                                   // operator chip
let SHOWN = null;                                 // the operator the map layers currently reflect

// Wedges are smaller than a pixel when the whole county is on screen. Draw them
// only once the map is close enough for them to mean something.
const CONE_ZOOM = 14;
let conesOn = false;

// "0;182" is two readers on one pole facing both ways: one tick per direction
const dirs = d => String(d ?? '').split(';').map(s => s.trim()).filter(s => s !== '' && !isNaN(+s)).map(Number);
// Two bearings on one pole read as "0° and 176°"; the joining word is a word, so it
// gets translated with everything else.
const dirText = d => { const a = dirs(d); return a.length ? a.map(x => x + '°').join(' ' + T('and') + ' ') : ''; };

function pinIcon(dir, on) {
  const rot = dirs(dir).map(x => `<s style="transform:rotate(${x}deg)"></s>`).join('');
  return L.divIcon({ className: '', iconSize: [16, 16], iconAnchor: [8, 8], popupAnchor: [0, -8], html: `<div class="pin${on ? ' on' : ''}">${rot}<i></i></div>` });
}

// A reader sees roughly 30° either side of where it points, out to about 75 m of road.
// The wedge is that: one repeated mark, one varying parameter (design-taste §11c).
function coneFor(c) {
  const g = L.layerGroup();
  const R = 0.00068, HALF = 30;    // ~75 m in degrees of latitude; half-angle
  for (const d of dirs(c.direction)) {
    const pts = [[c.lat, c.lon]];
    for (let a = d - HALF; a <= d + HALF; a += 6) {
      const r = a * Math.PI / 180;
      pts.push([c.lat + R * Math.cos(r), c.lon + R * Math.sin(r) / Math.cos(c.lat * Math.PI / 180)]);
    }
    g.addLayer(L.polygon(pts, { color: '#E2635C', weight: 1, opacity: .55, fillColor: '#A11A17', fillOpacity: .18, interactive: false }));
  }
  return g;
}

const gmaps = c => `https://www.google.com/maps?q=${c.lat},${c.lon}`;
// The data is OpenStreetMap's. "Wrong / gone / missing" goes back to the source, at this
// exact node, in OSM's own editor — the person standing under the pole is the one who knows.
const osmEdit = c => /^\d+$/.test(c.id)
  ? `https://www.openstreetmap.org/edit?node=${c.id}#map=19/${c.lat}/${c.lon}`
  : `https://www.openstreetmap.org/edit#map=19/${c.lat}/${c.lon}`;
const osmAdd = (lat, lon) => `https://www.openstreetmap.org/edit#map=19/${lat}/${lon}`;
function popupHtml(c) {
  const bits = [];
  if (c.operator) bits.push(esc(c.operator));
  if (c.maker) bits.push(esc(c.maker));
  if (dirText(c.direction)) bits.push(T('faces {d}', { d: dirText(c.direction) }));
  const dist = HOME ? `<small>${esc(T('{mi} from {name}', { mi: fmtMi(milesTo(c)), name: HOME.name }))}</small>` : '';
  return `<b>${esc(c.label)}</b><small>${bits.join(' · ') || esc(T('no details recorded'))}</small>${dist}
    <div class="acts"><a href="${gmaps(c)}" target="_blank" rel="noopener">Google Maps ↗</a><a href="#" data-copy="${esc(c.label)}">${esc(T('Copy address'))}</a><a href="#" data-share="${esc(c.id)}">${esc(T('Copy link'))}</a><a href="${osmEdit(c)}" target="_blank" rel="noopener" title="${esc(T('Wrong, moved, or gone? Fix it at the source'))}" class="fix">${esc(T('Fix on OSM ↗'))}</a></div>`;
}
map.on('popupopen', e => {
  const el = e.popup.getElement();
  const copy = (a, text) => {
    a.onclick = async ev => {
      ev.preventDefault();
      try { await navigator.clipboard.writeText(text); a.textContent = T('Copied'); }
      catch (err) { say(T('The browser blocked the clipboard. Here it is: {text}', { text })); }
    };
  };
  const a = el.querySelector('[data-copy]'); if (a) copy(a, a.dataset.copy);
  const s = el.querySelector('[data-share]');
  if (s) {
    // A phone has a share sheet, and it beats a silent clipboard write every time.
    if (navigator.share) s.onclick = async ev => {
      ev.preventDefault();
      const c = BYID.get(s.dataset.share);
      try { await navigator.share({ title: 'Flock', text: c ? c.label : 'Flock', url: linkTo(s.dataset.share) }); }
      catch (err) { /* they closed the sheet; nothing to report */ }
    };
    else copy(s, linkTo(s.dataset.share));
  }
});

// A reader that isn't on the map: press and hold where it is (right-click on a desk),
// and OSM's editor opens there. Leaflet fires contextmenu for both.
map.on('contextmenu', e => {
  const { lat, lng } = e.latlng;
  L.popup({ closeButton: false, className: 'addpop' })
    .setLatLng(e.latlng)
    .setContent(`<b>${esc(T("Reader here that isn't on the map?"))}</b><small>${lat.toFixed(5)}, ${lng.toFixed(5)}</small>
      <div class="acts"><a href="${osmAdd(lat, lng)}" target="_blank" rel="noopener" class="fix">${esc(T('Add it on OSM ↗'))}</a></div>`)
    .openOn(map);
});

// ---- distance
const milesTo = c => HOME ? haversine(HOME.lat, HOME.lon, c.lat, c.lon) : null;
function haversine(a, b, c, d) {
  const R = 3958.8, r = x => x * Math.PI / 180, dl = r(c - a), dg = r(d - b);
  const h = Math.sin(dl / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dg / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
// Everything is computed in miles; this is the only place that decides how to say it.
let UNITS = 'mi';
try { UNITS = localStorage.getItem('flock.units') === 'km' ? 'km' : 'mi'; } catch (e) {}
const fmtMi = m => {
  if (UNITS === 'km') {
    const k = m * 1.609344;
    return k < .1 ? Math.round(k * 1000) + ' m' : k.toFixed(k < 10 ? 1 : 0) + ' km';
  }
  return m < .1 ? Math.round(m * 5280) + ' ft' : m.toFixed(m < 10 ? 1 : 0) + ' mi';
};

// The "me" mark carries a heading arrow. Leaflet can't rotate the whole map, and rotating
// a map in a moving car is worse than a fixed north-up with an arrow anyway.
const meIcon = () => L.divIcon({ className: '', iconSize: [22, 22], iconAnchor: [11, 11], html: '<div class="me"><i class="hd"></i></div>' });
let HEADING = null;
function setHeading(deg) {
  HEADING = (deg == null || isNaN(deg)) ? null : deg;
  const el = HOMEMARK?.getElement()?.querySelector('.hd');
  if (!el) return;
  el.style.display = HEADING == null ? 'none' : '';
  if (HEADING != null) el.style.transform = `rotate(${HEADING}deg)`;
}

function setHome(lat, lon, name, { quiet } = {}) {
  const moved = !HOME || HOME.name !== name;
  HOME = { lat, lon, name };
  if (!HOMEMARK) {
    HOMEMARK = L.marker([lat, lon], { icon: meIcon(), title: name, zIndexOffset: 1000 }).addTo(map);
    RING = L.circle([lat, lon], { radius: 1609.34, color: '#D68A3E', weight: 1, opacity: .45, fillOpacity: .03, interactive: false }).addTo(map);
  } else {
    HOMEMARK.setLatLng([lat, lon]); RING.setLatLng([lat, lon]);
  }
  setHeading(HEADING);
  for (const c of CAMS) MARK[c.id].setPopupContent(popupHtml(c));
  // First fix flies in. Later fixes from the watch just nudge — no yanking the map
  // out from under a finger that is dragging it.
  if (moved && !quiet) fly([lat, lon], 13, .7);
  else if (FOLLOW && !DRAGGING) map.panTo([lat, lon], { animate: !CALM.matches, duration: .4 });
  render($('#q').value);
}
function clearHome() {
  stopWatch();
  HOME = null;
  if (HOMEMARK) map.removeLayer(HOMEMARK); if (RING) map.removeLayer(RING);
  HOMEMARK = RING = null; HEADING = null;
  for (const c of CAMS) MARK[c.id].setPopupContent(popupHtml(c));
  render($('#q').value);
}

// "Near me" is a live watch, not a one-shot: the list re-sorts and the arrow turns as
// you move. Tapping it again stops. Dragging the map pauses following until re-tapped.
let WATCH = null, FOLLOW = false, DRAGGING = false;
map.on('dragstart', () => { DRAGGING = true; if (FOLLOW) { FOLLOW = false; paintWatch(); } });
map.on('dragend', () => { DRAGGING = false; });

// Three states, shown on both buttons at once: off, located but panned away, following.
function paintWatch(busy) {
  const b = $('#near'), l = $('#locate');
  b.classList.toggle('busy', !!busy); b.disabled = !!busy;
  b.classList.toggle('on', WATCH != null);
  b.textContent = FOLLOW ? T('Following') : T('Near me');
  l.classList.toggle('busy', !!busy);
  l.classList.toggle('on', FOLLOW);
  l.classList.toggle('held', WATCH != null && !FOLLOW);
  const t = WATCH == null ? T('Show where you are')
          : FOLLOW ? T('Following you — tap to stop') : T('Back to where you are');
  l.title = t; l.setAttribute('aria-label', t);
}
// A phone that locks its screen mid-run is no use as a map. The lock is released again
// the moment following stops, and the browser drops it by itself on a hidden tab.
let WAKE = null;
async function keepAwake(on) {
  try {
    if (on && !WAKE && navigator.wakeLock) WAKE = await navigator.wakeLock.request('screen');
    else if (!on && WAKE) { await WAKE.release(); WAKE = null; }
  } catch (e) { WAKE = null; }
}
addEventListener('visibilitychange', () => { if (!document.hidden && FOLLOW) keepAwake(true); });
function stopWatch() {
  keepAwake(false);
  if (WATCH != null) navigator.geolocation.clearWatch(WATCH);
  WATCH = null; FOLLOW = false;
  paintWatch();
}
function startWatch() {
  if (WATCH != null) return;
  if (!navigator.geolocation) return say(T('This browser cannot share a location. Type an address instead.'), true);
  paintWatch(true); say(T('Finding you…'));
  let first = true;
  WATCH = navigator.geolocation.watchPosition(p => {
    if (first) { FOLLOW = true; say(''); paintWatch(); keepAwake(true); }
    setHeading(p.coords.heading);   // null when standing still; the arrow hides itself
    setHome(p.coords.latitude, p.coords.longitude, 'you', { quiet: !first });
    first = false;
  }, err => {
    stopWatch();
    say(err.code === 1 ? T('Location was refused. Allow it in the browser, or type an address instead.')
                       : T('Could not get a location. Type an address instead.'), true);
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 });
}
$('#near').onclick = () => { WATCH != null ? stopWatch() : startWatch(); };
// On the map the same button reads differently: after panning away, the useful thing is
// to come back, not to switch the whole thing off.
$('#locate').onclick = () => {
  if (WATCH == null) return startWatch();
  if (!FOLLOW) {
    FOLLOW = true; paintWatch();
    if (HOME) fly([HOME.lat, HOME.lon], Math.max(map.getZoom(), 15));
    return;
  }
  stopWatch();
};

// An address in the box: Enter looks it up (Nominatim, no key) and measures from there.
// Plain typing still filters the list live.
async function geocode(q) {
  const u = 'https://nominatim.openstreetmap.org/search?' + new URLSearchParams({ q: q + ', South Carolina', format: 'jsonv2', limit: 1, countrycodes: 'us' });
  const r = await fetch(u, { headers: { 'Accept-Language': 'en' } });
  const j = await r.json();
  return j[0] ? { lat: +j[0].lat, lon: +j[0].lon, name: (j[0].display_name || q).split(',').slice(0, 2).join(',') } : null;
}
// Typing filters live, but one frame behind the keystroke so a fast typist isn't
// waiting on 200 rows being laid out between letters.
let typeTimer = null;
$('#q').addEventListener('input', e => {
  const v = e.target.value;
  clearTimeout(typeTimer);
  typeTimer = setTimeout(() => render(v), 90);
});
$('#q').addEventListener('keydown', async e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); return step(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); return step(-1); }
  if (e.key === 'Escape') {
    e.preventDefault();
    if (e.target.value) { e.target.value = ''; render(''); }
    else if (HOME) clearHome();
    else if (OP !== 'all') resetFilters();
    return;
  }
  if (e.key !== 'Enter') return;
  // Arrowing to a row makes Enter mean "this one", not "look this address up".
  if (ARROWED && KB >= 0 && ROWS[KB]) { e.preventDefault(); return select(ROWS[KB].id, true); }
  const q = e.target.value.trim(); if (!q) return;
  e.target.disabled = true; say(T('Looking up “{q}”…', { q }));
  try {
    const hit = await geocode(q);
    if (hit) { e.target.value = ''; say(''); setHome(hit.lat, hit.lon, hit.name); }
    else say(T('Could not find “{q}”. Try a street and a town.', { q }), true);
  } catch (err) { say(T('Address lookup failed — no internet, or the lookup service is busy.'), true); }
  e.target.disabled = false; e.target.focus();
});

// ---- operator chips: what the data actually contains, not a fixed list
function buildChips() {
  const ops = {};
  for (const c of CAMS) { const k = opKey(c); ops[k] = (ops[k] || 0) + 1; }
  const order = Object.keys(ops).sort((a, b) => ops[b] - ops[a]);
  $('#chips').innerHTML = `<button data-op="all" class="${OP === 'all' ? 'on' : ''}">${esc(T('All'))} <small>${CAMS.length}</small></button>` +
    order.map(k => `<button data-op="${esc(k)}" class="${OP === k ? 'on' : ''}">${esc(T(k))} <small>${ops[k]}</small></button>`).join('') +
    `<span class="sp"></span><span class="near" id="nearlab"></span>`;
  $('#chips').querySelectorAll('button').forEach(b => b.onclick = () => {
    OP = b.dataset.op;
    $('#chips').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    render($('#q').value);
  });
}
function opKey(c) {
  const o = (c.operator || '').trim();
  if (!o) return 'Unknown';
  if (/police|sheriff|county|city of|town of|department/i.test(o)) return 'Police';
  return o.length > 18 ? o.slice(0, 17) + '…' : o;
}
const opMatch = c => OP === 'all' || opKey(c) === OP;

// Markers follow the chips so the filter means something on the map too; wedges
// additionally wait for zoom. Both only touch the map when something actually changed.
let viewKey = '';
function syncLayers() {
  const z = map.getZoom();
  const wantCones = z >= CONE_ZOOM;
  const wantPins = z >= PIN_ZOOM;
  const opChanged = SHOWN !== OP;
  // A generous margin round the screen, so a small drag does not empty the edges.
  const view = map.getBounds().pad(.4);
  // Panning changes what should be on the map, so the view is part of what is compared.
  const key = [OP, wantCones, wantPins, wantPins ? view.toBBoxString() : ''].join('|');
  if (key === viewKey) return;
  viewKey = key;
  for (const c of CAMS) {
    // Off-screen readers are left off entirely: this is the difference between a smooth
    // map and a stuttering one once the town has a couple of thousand of them.
    const on = opMatch(c) && view.contains([c.lat, c.lon]);
    const wantPin = on && wantPins;
    if (wantPin && !map.hasLayer(MARK[c.id])) MARK[c.id].addTo(map);
    else if (!wantPin && map.hasLayer(MARK[c.id])) map.removeLayer(MARK[c.id]);
    const wantCone = on && wantCones;
    if (wantCone && !map.hasLayer(CONE[c.id])) CONE[c.id].addTo(map);
    else if (!wantCone && map.hasLayer(CONE[c.id])) map.removeLayer(CONE[c.id]);
  }
  if (opChanged) densBuilt = false;   // the crowding counts depend on which readers are in
  SHOWN = OP; conesOn = wantCones; pinsOn = wantPins;
  syncDensity(!wantPins);
}
map.on('zoomend moveend', syncLayers);

// ---- density, below PIN_ZOOM
// Two hundred identical pins on a county hide the only interesting fact at that scale:
// where they cluster. So under PIN_ZOOM the pins go and each reader becomes one soft
// disc whose size is how many others sit within ~800 m of it. One mark, one parameter.
const PIN_ZOOM = 13;
let pinsOn = true;
const DENS = L.layerGroup();
let densBuilt = false;
function buildDensity() {
  DENS.clearLayers();
  const R = 0.5;   // miles; the crowding radius
  const rows = CAMS.filter(opMatch);
  // Comparing every reader with every other is fine for a few hundred and far too slow
  // for a few thousand. Buckets of about a mile mean only the neighbours get compared.
  const CELL = 0.02;                        // degrees, comfortably wider than R
  const grid = new Map();
  const cellOf = (la, lo) => Math.round(la / CELL) + ':' + Math.round(lo / CELL);
  for (const o of rows) {
    const k = cellOf(o.lat, o.lon);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(o);
  }
  for (const c of rows) {
    let n = 0;
    const ci = Math.round(c.lat / CELL), cj = Math.round(c.lon / CELL);
    for (let i = ci - 1; i <= ci + 1; i++) for (let j = cj - 1; j <= cj + 1; j++) {
      const bucket = grid.get(i + ':' + j);
      if (bucket) for (const o of bucket) if (o !== c && haversine(c.lat, c.lon, o.lat, o.lon) < R) n++;
    }
    // 1 neighbour -> small, 12+ -> big. Radius in metres so it scales with the map.
    const m = 120 + Math.min(n, 12) * 55;
    DENS.addLayer(L.circle([c.lat, c.lon], { radius: m, stroke: false, fillColor: '#A11A17', fillOpacity: .16, interactive: false }));
    // the reader itself, so the field still has its points
    DENS.addLayer(L.circleMarker([c.lat, c.lon], { radius: 2.2, stroke: false, fillColor: '#E2635C', fillOpacity: .9, interactive: false }));
  }
  densBuilt = true;
}
function syncDensity(want) {
  if (want) {
    if (!densBuilt) buildDensity();
    if (!map.hasLayer(DENS)) DENS.addTo(map);
  } else if (map.hasLayer(DENS)) map.removeLayer(DENS);
}

function select(id, move) {
  const prev = byId(CUR);
  if (prev && MARK[CUR]) MARK[CUR].setIcon(pinIcon(prev.direction, false));
  CUR = id;
  const c = byId(id), m = MARK[id];
  if (!c || !m) return;
  m.setIcon(pinIcon(c.direction, true));
  // Below PIN_ZOOM the marker isn't on the map yet; put it there so the popup has an anchor.
  if (!map.hasLayer(m)) m.addTo(map);
  if (move) fly([c.lat, c.lon], Math.max(map.getZoom(), 17), .6);
  m.openPopup();
  KB = ROWS.findIndex(r => r.id === id);
  markRows();
  // The address bar names the selected reader, so the page can be sent as it is being read.
  // replaceState, not a hash assignment: arrowing down the list shouldn't fill the Back button.
  try { history.replaceState(null, '', '#cam=' + encodeURIComponent(id)); } catch (e) {}
}
const linkTo = id => location.origin + location.pathname + '#cam=' + encodeURIComponent(id);

// A link someone was sent, or one pasted into the bar of an open tab.
function fromHash(fly) {
  const m = /[#&]cam=([^&]+)/.exec(location.hash);
  if (!m) return false;
  const id = decodeURIComponent(m[1]);
  if (!BYID.has(id)) { say(T('That link points at a reader this copy does not have.'), true); return false; }
  select(id, fly);
  return true;
}
addEventListener('hashchange', () => fromHash(true));
const byId = id => BYID.get(id) || null;

// Only the two rows whose state changed are touched, not all 200.
function markRows() {
  $('#list').querySelectorAll('.li').forEach(el => {
    const on = el.dataset.id === CUR;
    el.classList.toggle('on', on);
    el.setAttribute('aria-selected', on ? 'true' : 'false');
    el.classList.toggle('kb', ARROWED && KB >= 0 && !!ROWS[KB] && el.dataset.id === ROWS[KB].id);
    if (on) el.scrollIntoView({ block: 'nearest' });
  });
}

// Arrow keys walk the list from the search box; Escape backs out one step at a time.
function step(n) {
  if (!ROWS.length) return;
  KB = KB < 0 ? (n > 0 ? 0 : ROWS.length - 1) : Math.min(ROWS.length - 1, Math.max(0, KB + n));
  ARROWED = true;
  select(ROWS[KB].id, true);
}

function render(q) {
  const list = $('#list');
  q = (q || '').trim().toLowerCase();
  // c.find is built once at boot from the fields that exist, so a missing operator
  // can no longer put the literal word "undefined" into the haystack.
  let rows = CAMS.filter(c => opMatch(c) && (!q || c.find.includes(q)));
  if (HOME) rows = rows.slice().sort((a, b) => milesTo(a) - milesTo(b));
  syncLayers();

  const nl = $('#nearlab');
  if (nl) nl.innerHTML = HOME ? `${esc(T('from {name}', { name: '␀' })).replace('␀', '<b>' + esc(HOME.name) + '</b>')}<a title="${esc(T('Stop measuring'))}" id="clearhome" role="button" tabindex="0">✕</a>` : '';
  if (nl && HOME) $('#clearhome').onclick = clearHome;

  ROWS = rows;
  KB = CUR ? rows.findIndex(r => r.id === CUR) : -1;
  ARROWED = false;   // the list moved under it; Enter goes back to meaning "look this address up"
  $('#count').textContent = rows.length !== CAMS.length
    ? T('{a} of {b} cameras', { a: rows.length, b: CAMS.length })
    : T('{n} cameras', { n: CAMS.length });

  if (!rows.length) {
    const why = q && OP !== 'all' ? esc(T('Nothing matches “{q}” under {op}.', { q, op: T(OP) }))
              : q ? esc(T('Nothing matches “{q}”.', { q }))
              : esc(T('No cameras under {op}.', { op: T(OP) }));
    list.innerHTML = `<div class="empty">${why}<br><button id="resetf">${esc(T('Clear the filters'))}</button></div>`;
    $('#resetf').onclick = resetFilters;
    return;
  }

  let town = null, html = '';
  for (const c of rows) {
    if (!HOME) {
      const t = c.city || T('Unplaced');
      if (t !== town) { town = t; html += `<div class="town">${esc(t)}</div>`; }
    }
    const d = HOME ? `<b>${fmtMi(milesTo(c))}</b>${esc(dirText(c.direction))}` : esc(dirText(c.direction));
    html += `<div class="li${c.id === CUR ? ' on' : ''}" data-id="${c.id}" role="option" aria-selected="${c.id === CUR}">
      <span class="a">${esc(c.label)}</span>

  const vh = () => innerHeight || document.documentElement.clientHeight;
  const settle = () => setTimeout(() => map.invalidateSize({ pan: false }), 60);

  grip.addEventListener('pointerdown', e => {
    if (!PHONE.matches) return;
    dragging = true; moved = 0;
    startY = e.clientY; startH = aside.getBoundingClientRect().height;
    try { grip.setPointerCapture(e.pointerId); } catch (err) { /* nothing to capture */ }
    // While a finger owns the split, the animated max-height would fight it.
    aside.style.transition = 'none';
  });
  grip.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dy = startY - e.clientY;
    moved = Math.max(moved, Math.abs(dy));
    const h = Math.min(vh() * 0.86, Math.max(vh() * 0.22, startH + dy));

    map.invalidateSize({ pan: false });
  });
  const end = e => {
    if (!dragging) return;
    dragging = false;
    aside.style.transition = '';
    if (moved < 6) {                       // a tap, not a drag
      aside.style.maxHeight = '';
      app.classList.toggle('grown');
      settle();

  };
  grip.addEventListener('pointerup', end);
  grip.addEventListener('pointercancel', end);

  $('#list').addEventListener('scroll', () => {
    if (!dragging && aside.style.maxHeight && $('#list').scrollTop <= 8) { aside.style.maxHeight = ''; settle(); }

// ---------------------------------------------------------------- routes past no cameras
// Valhalla, the router OpenStreetMap itself runs, is asked for a handful of ways to get
// there. Each one is measured against the camera list, and whichever passes fewest wins.
// If the best still passes some, it is asked again with those exact cameras excluded.
const VALHALLA = 'https://valhalla1.openstreetmap.de/route';
let PASS_M = 55;            // within this of the line is "you went past it"
const ROUTE_LINE = { clean: '#D68A3E', other: '#6F6B66' };
let PLANNING = false, ROUTED = [], ROUTE_LAYER = L.layerGroup(), PICKED = 0, MODE = 'pedestrian', ROUTE_ENDS = null;
ROUTE_LAYER.addTo(map);

// Valhalla returns polyline6 — the usual algorithm with six decimals instead of five.
function decode6(str) {
  const out = []; let i = 0, lat = 0, lon = 0;
  while (i < str.length) {
    let r = 0, sh = 0, b;
    do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20);
    lat += (r & 1) ? ~(r >> 1) : (r >> 1);
    r = 0; sh = 0;
    do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << sh; sh += 5; } while (b >= 0x20);
    lon += (r & 1) ? ~(r >> 1) : (r >> 1);
    out.push([lat / 1e6, lon / 1e6]);
  }
  return out;
}

// Metres from a point to a segment, flat-earth over these distances (a few km at most).
function segMetres(plat, plon, alat, alon, blat, blon) {
  const k = Math.cos(plat * Math.PI / 180), M = 111320;
  const ax = (alon - plon) * k * M, ay = (alat - plat) * M;
  const bx = (blon - plon) * k * M, by = (blat - plat) * M;
  const dx = bx - ax, dy = by - ay, len = dx * dx + dy * dy;
  let t = len ? -(ax * dx + ay * dy) / len : 0;
  t = Math.max(0, Math.min(1, t));
  const x = ax + t * dx, y = ay + t * dy;
  return Math.hypot(x, y);
}

// Which cameras this line goes past. Only cameras inside the route's bounding box are
// measured properly; the rest are thrown out by a cheap box test first.
function camerasOn(pts) {
  if (!pts.length) return [];
  let n = -90, s = 90, e = -180, w = 180;
  for (const [la, lo] of pts) {
    if (la > n) n = la; if (la < s) s = la;
    if (lo > e) e = lo; if (lo < w) w = lo;
  }
  const pad = PASS_M / 111320 * 1.5;
  const hit = [];
  for (const c of CAMS) {
    if (c.lat < s - pad || c.lat > n + pad || c.lon < w - pad || c.lon > e + pad) continue;
    let best = Infinity;
    for (let i = 1; i < pts.length && best > PASS_M; i++)
      best = Math.min(best, segMetres(c.lat, c.lon, pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]));
    if (best <= PASS_M) hit.push(c);
  }
  return hit;
}

// Four ways of going. Run and Walk are the same costing at different speeds, which is
// what changes the time it quotes rather than the roads it picks.
const MODES = {
  run:   { costing: 'pedestrian', costing_options: { pedestrian: { walking_speed: 9.5 } } },
  walk:  { costing: 'pedestrian' },
  bike:  { costing: 'bicycle' },
  drive: { costing: 'auto' },
};
const WIDTHS = { close: 30, normal: 55, wide: 120 };
let TRIPMODE = 'run', WIDTH = 'normal';
try {
  const m = localStorage.getItem('flock.mode'); if (m in MODES) TRIPMODE = m;
  const w = localStorage.getItem('flock.width'); if (w in WIDTHS) WIDTH = w;
} catch (e) {}
PASS_M = WIDTHS[WIDTH];

let FROM = null, TO = null, PICKING = null;

async function valhalla(from, to, exclude) {
  const m = MODES[TRIPMODE];
  const body = {
    locations: [{ lat: from.lat, lon: from.lon }, { lat: to.lat, lon: to.lon }],
    costing: m.costing, alternates: 3, units: 'miles',
    directions_options: { language: 'en-US' },   // the router's own words stay English
  };
  if (m.costing_options) body.costing_options = m.costing_options;
  if (exclude && exclude.length) body.exclude_locations = exclude.slice(0, 48).map(c => ({ lat: c.lat, lon: c.lon }));
  const r = await fetch(VALHALLA + '?json=' + encodeURIComponent(JSON.stringify(body)));
  if (!r.ok) throw new Error('router ' + r.status);
  const j = await r.json();
  const trips = [j.trip, ...(j.alternates || []).map(a => a.trip)].filter(t => t && t.legs);
  return trips.map(t => ({
    pts: t.legs.flatMap(l => decode6(l.shape)),
    miles: t.summary ? t.summary.length : 0,
    secs: t.summary ? t.summary.time : 0,
  }));
}

function scoreAndKeep(list) {
  for (const r of list) {
    const key = r.pts.length ? r.pts[Math.floor(r.pts.length / 2)].join(',') : '';
    r.hits = camerasOn(r.pts); r.n = r.hits.length; r.key = key + '|' + Math.round(r.miles * 100);
  }
  const seen = new Set();
  return list.filter(r => r.pts.length && !seen.has(r.key) && seen.add(r.key))
             .sort((a, b) => a.n - b.n || a.miles - b.miles);
}

// Ask, look at what the best answer still passes, name those as places to avoid, ask
// again. Three rounds at most, and it stops early the moment a round stops helping —
// otherwise it would keep paying for calls that return the same road.
async function search(from, to) {
  const onEnd = (c, pt) => haversine(c.lat, c.lon, pt.lat, pt.lon) < 0.09;   // ~150 m
  let pool = scoreAndKeep(await valhalla(from, to));
  const avoid = new Map();
  for (let round = 0; round < 3 && pool.length && pool[0].n; round++) {
    let added = 0;
    for (const c of pool[0].hits) {
      // A camera on top of the start or the finish cannot be avoided, and asking anyway
      // makes the router refuse the whole request.
      if (!avoid.has(c.id) && !onEnd(c, from) && !onEnd(c, to)) { avoid.set(c.id, c); added++; }
    }
    if (!added) break;
    const before = pool[0].n;
    let more;
    try { more = await valhalla(from, to, [...avoid.values()]); }
    catch (e) { break; }                       // the answers already in hand still stand
    pool = scoreAndKeep(pool.concat(more));
    if (pool[0].n >= before) break;
  }
  return pool;
}

const fmtSecs = t => {
  const m = Math.round(t / 60);
  return m < 60 ? T('{n} min', { n: m })
                : T('{h} h {m}', { h: Math.floor(m / 60), m: String(m % 60).padStart(2, '0') });
};

function drawRoutes() {
  ROUTE_LAYER.clearLayers();
  ROUTED.forEach((r, i) => {
    const on = i === PICKED;
    ROUTE_LAYER.addLayer(L.polyline(r.pts, {
      color: on ? (r.n ? '#E9A75B' : ROUTE_LINE.clean) : ROUTE_LINE.other,
      weight: on ? 5 : 3, opacity: on ? .95 : .45, dashArray: on ? null : '5 6', interactive: false,
    }));
  });
  // The two ends, so it is obvious which way round the line runs.
  const pick = ROUTED[PICKED];
  if (pick && pick.pts.length) {
    const ends = [[pick.pts[0], '#D2CEC7', T('Start')], [pick.pts[pick.pts.length - 1], '#D68A3E', T('Finish')]];
    for (const [pt, col, label] of ends) {
      ROUTE_LAYER.addLayer(L.circleMarker(pt, {
        radius: 6, color: col, weight: 2, fillColor: '#171213', fillOpacity: 1,
      }).bindTooltip(label, { direction: 'top' }));
    }
  }
  const box = $('#routes');
  box.innerHTML = `<div class="routes-h"><b>${esc(T('Routes'))}</b><span class="sp"></span>
      <button data-edit="1">${esc(T('Edit'))}</button>
      <button data-clear="1">${esc(T('Clear'))}</button></div>` +
    ROUTED.map((r, i) => `<button class="opt${i === PICKED ? ' on' : ''}" data-i="${i}">
        <span class="w">${r.n === 0 ? esc(T('no cameras')) : r.n === 1 ? esc(T('1 camera')) : esc(T('{n} cameras passed', { n: r.n }))}</span>
        <span class="m">${r.miles ? fmtMi(r.miles) : ''}${r.secs ? ' \u00b7 ' + esc(fmtSecs(r.secs)) : ''}</span>
        ${i === PICKED ? `<span class="c${r.n ? '' : ' clean'}">${r.n ? esc(T('Nothing avoids them all. The cleanest way passes {n}.', { n: r.n })) : esc(T('clear of every camera'))}</span>` : ''}
      </button>`).join('');
  box.classList.add('show');
  box.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { PICKED = +b.dataset.i; drawRoutes(); });
  box.querySelector('[data-edit]').onclick = openTrip;
  box.querySelector('[data-clear]').onclick = clearRoutes;
}

function clearRoutes() {
  ROUTED = []; PICKED = 0; ROUTE_ENDS = null;
  ROUTE_LAYER.clearLayers();
  $('#routes').classList.remove('show');
  $('#routes').innerHTML = '';
  PLANNING = false;
  $('#plan').classList.remove('on', 'busy');
}

async function runRoute(from, to) {
  ROUTE_ENDS = { from, to };
  $('#plan').classList.add('busy');
  say(T('Finding a way around them\u2026'));
  try {
    const list = await search(from, to);
    if (!list.length) { say(T('No route came back. The routing service may be busy.'), true); return; }
    ROUTED = list.slice(0, 4); PICKED = 0;
    drawRoutes();
    map.fitBounds(L.polyline(ROUTED[0].pts).getBounds(), { padding: [30, 30] });
    say('');
  } catch (err) {
    say(T('Routing failed \u2014 no internet, or the routing service is busy.'), true);
  } finally {
    $('#plan').classList.remove('busy', 'on');
    PLANNING = false;
  }
}

// ---------------------------------------------------------------- the box
const trip = $('#trip');
const tripSay = (msg, bad) => {
  const el = $('#tripstatus');
  el.textContent = msg || '';
  el.classList.toggle('bad', !!bad);
};
function paintSegs() {
  $('#modes').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === TRIPMODE));
  $('#widths').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.w === WIDTH));
}
function openTrip() {
  if (HOME && !$('#from').value) { FROM = { lat: HOME.lat, lon: HOME.lon, name: HOME.name }; $('#from').value = HOME.name; }
  paintSegs();
  tripSay('');
  trip.showModal();
}
$('#plan').onclick = () => { PICKING ? cancelPick() : openTrip(); };
$('#trip-x').onclick = () => trip.close();
trip.addEventListener('click', e => { if (e.target === trip) trip.close(); });

$('#modes').querySelectorAll('button').forEach(b => b.onclick = () => {
  TRIPMODE = b.dataset.m;
  try { localStorage.setItem('flock.mode', TRIPMODE); } catch (e) {}
  paintSegs();
});
$('#widths').querySelectorAll('button').forEach(b => b.onclick = () => {
  WIDTH = b.dataset.w; PASS_M = WIDTHS[WIDTH];
  try { localStorage.setItem('flock.width', WIDTH); } catch (e) {}
  paintSegs();
});
$('#swap').onclick = () => {
  const a = $('#from').value, b = $('#to').value;
  $('#from').value = b; $('#to').value = a;
  const f = FROM; FROM = TO; TO = f;
};
$('#from-me').onclick = () => {
  if (HOME) { FROM = { lat: HOME.lat, lon: HOME.lon, name: HOME.name }; $('#from').value = HOME.name; return; }
  if (!navigator.geolocation) return tripSay(T('This browser cannot share a location. Type an address instead.'), true);
  tripSay(T('Finding you\u2026'));
  navigator.geolocation.getCurrentPosition(pos => {
    FROM = { lat: pos.coords.latitude, lon: pos.coords.longitude, name: T('Where you are') };
    $('#from').value = FROM.name;
    tripSay('');
  }, () => tripSay(T('Could not get a location. Type an address instead.'), true),
     { enableHighAccuracy: true, timeout: 15000 });
};

// Picking on the map: the box gets out of the way, the next tap is the point, and the
// box comes straight back with the field filled in.
function cancelPick() { PICKING = null; $('#plan').classList.remove('on'); say(''); }
document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
  PICKING = b.dataset.pick;
  trip.close();
  $('#plan').classList.add('on');
  say(PICKING === 'from' ? T('Tap the map to set the start.') : T('Tap the map to set the finish.'));
});
map.on('click', e => {
  if (!PICKING) return;
  const which = PICKING;
  PICKING = null;
  $('#plan').classList.remove('on');
  const pt = { lat: e.latlng.lat, lon: e.latlng.lng, name: T('Pinned point') };
  if (which === 'from') { FROM = pt; $('#from').value = pt.name; }
  else { TO = pt; $('#to').value = pt.name; }
  say('');
  openTrip();
});

// A field that still reads as it was resolved is taken as-is; anything retyped is looked up.
async function resolve(which) {
  const txt = $('#' + which).value.trim();
  const held = which === 'from' ? FROM : TO;
  if (held && held.name === txt) return held;
  if (!txt) return which === 'from' && HOME ? { lat: HOME.lat, lon: HOME.lon, name: HOME.name } : null;
  return await geocode(txt);
}
$('#go').onclick = async () => {
  const go = $('#go');
  go.disabled = true; tripSay(T('Looking up the addresses\u2026'));
  try {
    const f = await resolve('from');
    if (!f) return tripSay(T('Could not find that starting point.'), true);
    const t = await resolve('to');
    if (!t) return tripSay(T('Could not find that destination.'), true);
    FROM = f; TO = t;
    $('#from').value = f.name; $('#to').value = t.name;
    tripSay('');
    trip.close();
    runRoute(f, t);
  } catch (err) {
    tripSay(T('Address lookup failed \u2014 no internet, or the lookup service is busy.'), true);
  } finally {
    go.disabled = false;
  }
};

// Phone only: scrolling the list is a statement that the list is what is wanted, so it takes
// the room and the map drops to about half. Back at the top, the map comes back up.
(() => {
  const app = document.querySelector('.app'), list = $('#list');
  let queued = false;
  // Leaflet sizes its tiles once; after the box changes it has to be told.
  const settle = () => setTimeout(() => map.invalidateSize({ pan: false }), 320);
  const apply = () => {
    queued = false;
    const grown = app.classList.contains('grown');
    // Two thresholds, so a list resting near the line does not flicker between the two.
    const want = PHONE.matches && (grown ? list.scrollTop > 8 : list.scrollTop > 32);
    if (want !== grown) { app.classList.toggle('grown', want); settle(); }
  };
  list.addEventListener('scroll', () => { if (!queued) { queued = true; requestAnimationFrame(apply); } }, { passive: true });
  PHONE.addEventListener('change', () => { apply(); applyLang(); });
})();

// Keeping a saved copy current.
// The worker calls skipWaiting, so a republished sw.js takes over as soon as it installs.
// The page then reloads itself once, which is what makes opening the link update a copy
// that was saved weeks ago instead of showing last month's map until the next open.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  const SW = navigator.serviceWorker;
  // updateViaCache:'none' stops the browser serving sw.js from its own HTTP cache, which
  // is what otherwise hides a new build for up to a day.
  SW.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    // Was this tab already under a worker? If not, this is the first ever visit and the
    // handover below is just the normal install, not an update.
    const HAD = !!SW.controller;
    const OPENED = performance.now();
    let RELOADING = false, PENDING = false, LAST = 0;

    const check = () => {
      if (document.hidden || performance.now() - LAST < 30000) return;
      LAST = performance.now();
      reg.update().catch(() => {});
    };
    check();
    addEventListener('visibilitychange', () => { if (!document.hidden) { check(); if (PENDING) swap(); } });
    addEventListener('online', check);

    function swap() {
      if (RELOADING) return;
      RELOADING = true;
      location.reload();
    }

    SW.addEventListener('controllerchange', () => {
      if (!HAD) return;                       // first install: nothing to replace
      // Straight in if they have only just opened it, or are not looking. Otherwise wait,
      // so a reload never lands in the middle of reading a camera.
      if (performance.now() - OPENED < 8000 || document.hidden) return swap();
      PENDING = true;
      try { say(T('Updated — reopen to get the new version')); } catch (e) {}
    });
  }).catch(() => {});
}
</script>
